<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이메일 찾기 | 스윗한 케이크</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
  <script defer th:src="@{/js/member-birth-date.js}"></script>
</head>
<body>
<header th:replace="~{fragments/common/header :: header}"></header>
<main class="page-container page-container--narrow">
  <section class="panel auth-card section">
    <h1>이메일 찾기</h1>
    <div th:replace="~{fragments/common/alert :: alert}"></div>
    <p class="form-help">회원가입 시 입력한 정보를 입력해 주세요.</p>

    <form class="form-stack" th:action="@{/find-email}" th:object="${emailRecoveryForm}" method="post">
      <div class="form-group">
        <label class="form-label" for="recovery-name">이름</label>
        <input class="form-control" id="recovery-name" th:field="*{name}" maxlength="50" required autofocus>
        <p class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="email-recovery-birth-date">생년월일</label>
        <div data-birth-date-picker>
          <input class="form-control" id="email-recovery-birth-date" type="date"
                 th:field="*{birthDate}" data-birth-date-value required>
          <div class="birth-date-selects">
          <select class="form-control" id="email-recovery-birth-year" aria-label="태어난 연도"
                  data-birth-year required>
            <option value="">연도</option>
          </select>
          <select class="form-control" aria-label="태어난 달" data-birth-month required>
            <option value="">월</option>
          </select>
          <select class="form-control" aria-label="태어난 일" data-birth-day required>
            <option value="">일</option>
          </select>
          </div>
        </div>
        <p class="form-error" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="recovery-phone">전화번호</label>
        <input class="form-control" id="recovery-phone" th:field="*{phone}" type="tel"
               placeholder="010-0000-0000" maxlength="13" required>
        <p class="form-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
      </div>

      <button class="btn btn--primary btn--block" type="submit">이메일 찾기</button>
    </form>

    <div class="section" th:if="${searched and #lists.isEmpty(recoveredEmails)}">
      <p class="alert alert--error">
        입력한 정보와 일치하는 이메일을 찾을 수 없습니다.
      </p>
    </div>

    <div class="cluster">
      <a class="btn" th:href="@{/login}">로그인으로 돌아가기</a>
    </div>
  </section>

  <div class="modal" id="email-results-modal"
       th:if="${searched and !#lists.isEmpty(recoveredEmails)}">
    <div class="modal__dialog" role="dialog" aria-modal="true"
         aria-labelledby="email-results-modal-title">
      <h2 id="email-results-modal-title">가입 이메일 목록</h2>
      <p class="form-help">로그인할 이메일을 선택해 주세요.</p>
      <form class="form-stack" th:action="@{/find-email/login}" method="post">
        <input type="hidden" name="recoveryToken" th:value="${recoveryToken}">
        <div class="choice-list">
          <label class="choice" th:each="recoveredEmail, status : ${recoveredEmails}">
            <input type="radio" name="selectedIndex" th:value="${recoveredEmail.selectionIndex}"
                   th:checked="${status.first}" required>
            <span th:text="${recoveredEmail.maskedEmail}"></span>
          </label>
        </div>
        <div class="cluster">
          <button class="btn btn--primary" type="submit">로그인하기</button>
          <button class="btn" type="button" data-modal-close>닫기</button>
        </div>
      </form>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
