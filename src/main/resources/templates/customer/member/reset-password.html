<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 재설정 | 스윗한 케이크</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body>
<header th:replace="~{fragments/common/header :: header}"></header>
<main class="page-container page-container--narrow">
  <section class="panel auth-card section">
    <h1>비밀번호 재설정</h1>
    <p class="form-help">새로 사용할 비밀번호를 입력해 주세요.</p>

    <form class="form-stack" th:action="@{/reset-password}"
          th:object="${passwordForm}" method="post">
      <div class="form-group">
        <label class="form-label" for="new-password">새 비밀번호</label>
        <input class="form-control" id="new-password" th:field="*{newPassword}"
               type="password" minlength="8" maxlength="100"
               autocomplete="new-password" required autofocus>
        <p class="form-error" th:if="${#fields.hasErrors('newPassword')}"
           th:errors="*{newPassword}"></p>
        <p class="form-help">8자 이상이며 영문, 숫자, 특수문자를 각각 포함해야 합니다.</p>
      </div>

      <div class="form-group">
        <label class="form-label" for="new-password-confirm">새 비밀번호 확인</label>
        <input class="form-control" id="new-password-confirm"
               th:field="*{newPasswordConfirm}" type="password"
               maxlength="100" autocomplete="new-password" required>
        <p class="form-error" th:if="${#fields.hasErrors('newPasswordConfirm')}"
           th:errors="*{newPasswordConfirm}"></p>
        <p class="form-error" th:if="${#fields.hasErrors('passwordConfirmed')}"
           th:errors="*{passwordConfirmed}"></p>
        <p class="form-help" id="password-match-message" aria-live="polite"></p>
      </div>

      <button class="btn btn--primary btn--block" type="submit">비밀번호 재설정</button>
    </form>
  </section>
</main>
<footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
<script>
  const passwordInput = document.getElementById('new-password');
  const passwordConfirmInput = document.getElementById('new-password-confirm');
  const passwordMatchMessage = document.getElementById('password-match-message');

  function updatePasswordMatchMessage() {
    if (!passwordConfirmInput.value) {
      passwordMatchMessage.innerText = "";
      passwordMatchMessage.className = "form-help";
      return;
    }

    const matches = passwordInput.value === passwordConfirmInput.value;
    passwordMatchMessage.innerText = matches
            ? "비밀번호가 일치합니다."
            : "비밀번호가 일치하지 않습니다.";
    passwordMatchMessage.className = matches ? "form-success" : "form-error";
  }

  passwordInput.addEventListener('input', updatePasswordMatchMessage);
  passwordConfirmInput.addEventListener('input', updatePasswordMatchMessage);
</script>
</body>
</html>
