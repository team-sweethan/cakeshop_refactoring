<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원정보 수정 | 스윗한 케이크</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body data-page-title="회원정보 수정">
<header th:replace="~{fragments/common/header :: header}"></header>
<main class="page-container page-container--form">
  <div class="page-heading cluster cluster--between">
    <h1>회원정보 수정</h1>
    <a class="btn" th:href="@{/mypage}">마이페이지로 돌아가기</a>
  </div>

  <form th:action="@{/mypage/profile/update}" th:method="post" th:object="${profileForm}">
    <section class="section">
      <h2 class="section-title">기본 정보</h2>
      <div class="panel">
        <div class="form-group">
          <label class="form-label" for="profile-name">이름 <span class="required">*</span></label>
          <input class="form-control" id="profile-name" name="name" th:field="*{name}" required>
          <p class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>
        <div class="form-group">
          <label class="form-label" for="profile-nickname">닉네임 <span class="required">*</span></label>
          <input class="form-control" id="profile-nickname" th:field="*{nickname}" required maxlength="50">
          <p class="form-error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></p>
        </div>
        <div class="form-group">
          <label class="form-label" for="profile-email">이메일</label>
          <input class="form-control" id="profile-email" type="email" th:field="*{email}" readonly>
          <p class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
          <p class="form-help">이메일 변경 불가</p>
        </div>
        <div class="form-group">
          <label class="form-label" for="profile-phone">전화번호 <span class="required">*</span></label>
          <input class="form-control" id="profile-phone" name="phone" type="tel" th:field="*{phone}" required maxlength="13">
          <p class="form-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
        </div>

        <div th:if="${hasPasswordLogin}">
          <hr class="divider">
          <h3 class="section-title">비밀번호 변경 <span class="text-muted">(선택)</span></h3>
          <div class="form-group">
            <label class="form-label" for="current-password">현재 비밀번호</label>
            <input class="form-control" id="current-password" type="password" th:field="*{currentPassword}">
            <p class="form-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="new-password">새 비밀번호</label>
            <input class="form-control" id="new-password" type="password" th:field="*{newPassword}">
            <p class="form-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
            <p class="form-error" th:if="${#fields.hasErrors('newPasswordValid')}" th:errors="*{newPasswordValid}"></p>
            <p class="form-help">8자 이상, 영문+숫자+특수문자</p>
          </div>
          <div class="form-group">
            <label class="form-label" for="new-password-confirm">새 비밀번호 확인</label>
            <input class="form-control" id="new-password-confirm" type="password" th:field="*{newPasswordConfirm}">
            <p class="form-error" th:if="${#fields.hasErrors('newPasswordConfirm')}" th:errors="*{newPasswordConfirm}"></p>
            <p class="form-error" th:if="${#fields.hasErrors('passwordChangeComplete')}" th:errors="*{passwordChangeComplete}"></p>
            <p class="form-error" th:if="${#fields.hasErrors('newPasswordConfirmed')}" th:errors="*{newPasswordConfirmed}"></p>
            <p class="form-help" id="new-password-match-message" aria-live="polite"></p>
          </div>
        </div>
        <p class="form-help" th:unless="${hasPasswordLogin}">
          소셜 로그인 회원은 별도의 비밀번호를 사용하지 않습니다.
        </p>

        <button class="btn btn--primary" type="submit">변경사항 저장</button>
      </div>
    </section>
  </form>

  <section class="section">
    <h2 class="section-title">회원 탈퇴</h2>
    <div class="panel panel--danger panel--dashed">
      <ul class="text-muted">
        <li>탈퇴 즉시 로그아웃되며 이 계정으로 다시 로그인할 수 없습니다.</li>
        <li>법령에 따라 보관해야 하는 거래기록은 정해진 기간 동안 별도로 보관될 수 있습니다.</li>
        <li>작성한 게시물과 주문 관련 처리 기준은 추후 연결되는 각 기능의 정책을 따릅니다.</li>
      </ul>
      <form class="form-stack" th:action="@{/mypage/withdraw}" method="post"
            th:object="${withdrawForm}">
        <div class="form-group" th:if="${hasPasswordLogin}">
          <label class="form-label" for="withdraw-current-password">현재 비밀번호</label>
          <input class="form-control" id="withdraw-current-password" type="password"
                 th:field="*{currentPassword}" maxlength="100" autocomplete="current-password">
          <p class="form-error" th:if="${#fields.hasErrors('currentPassword')}"
             th:errors="*{currentPassword}"></p>
        </div>
        <p class="form-help" th:unless="${hasPasswordLogin}">
          Google로 인증된 계정은 비밀번호 입력 없이 탈퇴할 수 있습니다.
        </p>
        <label class="choice" for="withdrawal-confirmed">
          <input id="withdrawal-confirmed" type="checkbox"
                 th:field="*{withdrawalConfirmed}" required>
          <span>위 회원 탈퇴 안내를 확인했습니다.</span>
        </label>
        <p class="form-error" th:if="${#fields.hasErrors('withdrawalConfirmed')}"
           th:errors="*{withdrawalConfirmed}"></p>
        <button class="btn btn--danger" type="submit" data-confirm="회원 탈퇴를 진행하시겠습니까?">회원 탈퇴</button>
      </form>
    </div>
  </section>
</main>
<footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>

<script>
  function formatPhoneNumber(value) {
    const digits = value.replace(/\D/g, '').slice(0, 11);

    if (digits.length <= 3) {
      return digits;
    }
    if (digits.length <= 7) {
      return `${digits.slice(0, 3)}-${digits.slice(3)}`;
    }
    if (digits.startsWith('010') || digits.length === 11) {
      return `${digits.slice(0, 3)}-${digits.slice(3, 7)}-${digits.slice(7)}`;
    }
    return `${digits.slice(0, 3)}-${digits.slice(3, 6)}-${digits.slice(6)}`;
  }

  const phoneInput = document.getElementById('profile-phone');
  phoneInput.addEventListener('input', (event) => {
    event.target.value = formatPhoneNumber(event.target.value);
  });

  const newPasswordInput = document.getElementById('new-password');
  const newPasswordConfirmInput = document.getElementById('new-password-confirm');
  const newPasswordMatchMessage = document.getElementById('new-password-match-message');

  function updateNewPasswordMatchMessage() {
    if (!newPasswordConfirmInput.value) {
      newPasswordMatchMessage.innerText = "";
      newPasswordMatchMessage.className = "form-help";
      return;
    }

    const matches = newPasswordInput.value === newPasswordConfirmInput.value;
    newPasswordMatchMessage.innerText = matches
            ? "비밀번호가 일치합니다."
            : "비밀번호가 일치하지 않습니다.";
    newPasswordMatchMessage.className = matches ? "form-success" : "form-error";
  }

  if (newPasswordInput && newPasswordConfirmInput && newPasswordMatchMessage) {
    newPasswordInput.addEventListener('input', updateNewPasswordMatchMessage);
    newPasswordConfirmInput.addEventListener('input', updateNewPasswordMatchMessage);
  }
</script>
</body>
</html>
