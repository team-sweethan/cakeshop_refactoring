<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 | 스윗한 케이크</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/mypage-layout.css}">
  <link rel="stylesheet" th:href="@{/css/member-mypage.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body data-page-title="마이페이지">
<header th:replace="~{fragments/common/header :: header}"></header>
<main class="page-container">
  <!--/* 화면 제목은 왼쪽 메뉴 맨 위 "마이페이지"가 대신한다. 화면 읽기 도구용 제목만 남긴다. */-->
  <h1 class="visually-hidden">마이페이지</h1>
  <div th:replace="~{fragments/common/alert :: alert}"></div>

  <!--/* 왼쪽은 쇼핑 · 활동 · 계정으로 묶은 메뉴, 오른쪽은 프로필 한 줄 · 요약 숫자 · 최근 주문.
         결제 완료 화면의 "마이페이지 > 주문 내역" 안내를 따라 들어오므로 주문이 첫 화면에 보이게 둔다. */-->
  <div class="layout-sidebar mypage-layout">
    <nav th:replace="~{fragments/customer/mypage-nav :: mypageNav('home')}"></nav>

    <div class="mypage-main">
      <!--/* 프로필 한 줄. 전화번호 · 생년월일 등은 회원정보 수정 화면에서 본다. */-->
      <section class="mypage-profile" aria-label="회원 정보">
        <span class="mypage-profile__avatar" aria-hidden="true"
              th:text="${#strings.isEmpty(member.nickname)} ? '♥' : ${#strings.substring(member.nickname, 0, 1)}">케</span>
        <div class="mypage-profile__text">
          <strong class="mypage-profile__name" th:text="|${member.nickname} 님|">케이크러버 님</strong>
          <span class="mypage-profile__email" th:text="${member.email}">user@cakeshop.local</span>
        </div>
        <a class="btn btn--sm mypage-profile__edit" th:href="@{/mypage/profile}">회원정보 수정</a>
      </section>

      <!--/* 요약 숫자. 누르면 해당 화면으로 간다. */-->
      <ul class="mypage-stats" aria-label="나의 현황">
        <li>
          <a class="mypage-stat" th:href="@{/orders}">
            <span class="mypage-stat__label">진행 중 주문</span>
            <strong class="mypage-stat__value">
              <span th:text="${orderSummary.inProgressCount}">0</span><small>건</small>
            </strong>
          </a>
        </li>
        <li>
          <a class="mypage-stat" th:href="@{/mypage/coupons}">
            <span class="mypage-stat__label">보유 쿠폰</span>
            <strong class="mypage-stat__value">
              <span th:text="${availableCouponCount}">0</span><small>장</small>
            </strong>
          </a>
        </li>
        <li>
          <a class="mypage-stat" th:href="@{/mypage/reviews/writable}">
            <span class="mypage-stat__label">작성할 후기</span>
            <strong class="mypage-stat__value">
              <span th:text="${writableReviewCount}">0</span><small>건</small>
            </strong>
          </a>
        </li>
      </ul>

      <section class="mypage-orders" aria-labelledby="in-progress-orders-title">
        <div class="mypage-orders__heading">
          <h2 id="in-progress-orders-title">진행 중인 주문</h2>
          <a class="mypage-orders__more" th:href="@{/orders}">전체 주문 내역 보기 &gt;</a>
        </div>

        <p class="mypage-order-empty"
           th:if="${#lists.isEmpty(orderSummary.inProgressOrders)}">
          진행 중인 주문이 없습니다.
        </p>

        <div class="mypage-order-list"
             th:unless="${#lists.isEmpty(orderSummary.inProgressOrders)}">
          <a class="mypage-order-card"
             th:each="order : ${orderSummary.inProgressOrders}"
             th:href="@{/orders/{orderId}(orderId=${order.orderId})}">
            <span class="mypage-order-card__main">
              <strong class="mypage-order-card__product">
                <span th:text="${order.productName}">딸기 생크림 케이크</span>
                <span class="text-muted"
                      th:if="${order.itemCount > 1}"
                      th:text="| 외 ${order.itemCount - 1}건|">외 1건</span>
              </strong>
              <span class="mypage-order-card__meta">
                <span th:text="|픽업 ${#temporals.format(order.pickupAt, 'MM.dd (E) HH:mm')}|">픽업 08.17 (월) 14:00</span>
                <span aria-hidden="true">·</span>
                <span th:text="|${#numbers.formatInteger(order.finalAmount, 1, 'COMMA')}원|">35,000원</span>
              </span>
              <span class="mypage-order-card__number" th:text="${order.orderNumber}">ORD-001</span>
            </span>
            <span class="mypage-order-card__badges">
              <span class="badge" th:text="${order.orderTypeLabel}">일반 상품</span>
              <span class="badge badge--info" th:text="${order.statusLabel}">제작 중</span>
            </span>
          </a>
        </div>
      </section>

      <section class="mypage-orders" aria-labelledby="completed-orders-title">
        <div class="mypage-orders__heading">
          <h2 id="completed-orders-title">완료된 주문</h2>
        </div>

        <p class="mypage-order-empty"
           th:if="${#lists.isEmpty(orderSummary.completedOrders)}">
          완료된 주문이 없습니다.
        </p>

        <div class="mypage-order-list"
             th:unless="${#lists.isEmpty(orderSummary.completedOrders)}">
          <a class="mypage-order-card"
             th:each="order : ${orderSummary.completedOrders}"
             th:href="@{/orders/{orderId}(orderId=${order.orderId})}">
            <span class="mypage-order-card__main">
              <strong class="mypage-order-card__product">
                <span th:text="${order.productName}">초코 케이크</span>
                <span class="text-muted"
                      th:if="${order.itemCount > 1}"
                      th:text="| 외 ${order.itemCount - 1}건|">외 1건</span>
              </strong>
              <span class="mypage-order-card__meta">
                <span th:text="|주문 ${#temporals.format(order.createdAt, 'yyyy.MM.dd')}|">주문 2026.08.10</span>
                <span aria-hidden="true">·</span>
                <span th:text="|${#numbers.formatInteger(order.finalAmount, 1, 'COMMA')}원|">35,000원</span>
              </span>
              <span class="mypage-order-card__number" th:text="${order.orderNumber}">ORD-002</span>
            </span>
            <span class="mypage-order-card__badges">
              <span class="badge" th:text="${order.orderTypeLabel}">주문 제작</span>
              <span class="badge badge--success" th:text="${order.statusLabel}">픽업 완료</span>
            </span>
          </a>
        </div>
      </section>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
