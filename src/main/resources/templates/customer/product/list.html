<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title th:text="${productListTitle + ' | 케이크 쇼핑몰'}">
    상품 목록 | 케이크 쇼핑몰
  </title>

  <link rel="stylesheet"
        th:href="@{/css/app.css(v='showcase-refresh')}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer
          th:src="@{/js/customer-mockup.js}"></script>
  <script defer
          th:src="@{/js/product-list-filter.js}"></script>
</head>

<body data-page-title="상품 목록"
      th:attr="data-page-title=${productListTitle}">
<header th:replace="~{fragments/common/header :: header}">
</header>

<main class="page-container page-container--catalog">
  <div th:replace="~{fragments/common/alert :: alert}"></div>

  <header class="page-intro page-intro--catalog">
    <p class="eyebrow">OUR CAKE COLLECTION</p>
    <h1 th:text="${productListTitle}">상품 목록</h1>
    <p>데일리 케이크부터 특별한 주문 제작까지, 오늘의 순간에 어울리는 케이크를 찾아보세요.</p>
  </header>

  <form class="product-catalog" method="get"
        th:action="@{/products}"
        role="search">

    <!-- 필터를 자동 제출해도 현재 정렬 조건을 유지한다. -->
    <input id="product-sort"
           type="hidden"
           name="sort"
           th:value="${condition.sort.name()}">

    <!-- 상품명 검색 -->
    <div class="cluster section product-search-bar">
      <label class="visually-hidden"
             for="product-search">
        상품명 검색
      </label>

      <input class="form-control"
             id="product-search"
             name="keyword"
             type="search"
             placeholder="어떤 케이크를 찾고 계세요?"
             th:value="${condition.keyword}"
             style="flex:1">

      <button class="btn btn--primary"
              type="submit">
        검색
      </button>
    </div>

    <div class="layout-sidebar">
      <!-- 상품 필터 -->
      <aside class="filter-panel catalog-filter">
        <h2 class="section-title">필터</h2>

        <!-- 상품 유형 -->
        <div class="form-group">
          <strong class="form-label">상품 유형</strong>

          <div class="filter-options">
            <label class="choice">
              <input type="radio"
                     name="type"
                     value=""
                     onchange="this.form.requestSubmit()"
                     th:checked="${condition.type == null}">
              전체
            </label>

            <label class="choice"
                   th:each="productType : ${productTypes}">

              <input type="radio"
                     name="type"
                     th:value="${productType.name()}"
                     onchange="this.form.requestSubmit()"
                     th:checked="${condition.type == productType}">

              <span th:text="${productType.displayName}">
                  상품 유형
                </span>
            </label>
          </div>
        </div>

        <!-- 가격대 -->
        <div class="form-group">
          <strong class="form-label">가격대</strong>

          <div class="price-range"
               data-product-price-range>
            <input class="form-control"
                   name="minPrice"
                   type="number"
                   min="0"
                   step="1"
                   value="0"
                   th:value="${condition.minPrice}"
                   aria-label="최소 가격">

            <span>~</span>

            <input class="form-control"
                   name="maxPrice"
                   type="number"
                   min="0"
                   step="1"
                   th:value="${condition.maxPrice}"
                   aria-label="최대 가격">
          </div>
        </div>

        <!-- 재고 상태 -->
        <div class="form-group">
          <strong class="form-label">재고 상태</strong>

          <div class="filter-options">
            <label class="choice">
              <input type="radio"
                     name="stock"
                     value=""
                     onchange="this.form.requestSubmit()"
                     th:checked="${condition.stock == null}">
              전체
            </label>

            <label class="choice"
                   th:each="stockFilter : ${stockFilters}">

              <input type="radio"
                     name="stock"
                     th:value="${stockFilter.name()}"
                     onchange="this.form.requestSubmit()"
                     th:checked="${condition.stock == stockFilter}">

              <span th:text="${stockFilter.displayName}">
                  재고 상태
                </span>
            </label>
          </div>
        </div>

        <div class="stack">
          <button class="btn btn--primary btn--block"
                  type="submit">
            필터 적용
          </button>

          <a class="btn btn--block"
             th:href="@{/products}">
            필터 초기화
          </a>
        </div>
      </aside>

      <!-- 상품 목록 -->
      <section>
        <div class="cluster cluster--between section">
            <span class="text-muted">
              총
              <strong th:text="${pageResult.totalElements}">
                0
              </strong>개 상품
            </span>

          <!-- 정렬 -->
          <div class="cluster">
            <button class="btn"
                    type="button"
                    th:each="sortOption : ${sortOptions}"
                    th:value="${sortOption.name()}"
                    onclick="this.form.elements['sort'].value = this.value; this.form.requestSubmit()"
                    th:classappend="${condition.sort == sortOption}
                          ? ' is-active'"
                    th:text="${sortOption.displayName}">
              정렬
            </button>
          </div>
        </div>

        <!-- 조회된 상품 카드 -->
        <div class="grid grid--4 product-grid"
             th:if="${!pageResult.content.isEmpty()}">

          <a class="product-card"
             th:each="product : ${pageResult.content}"
             th:href="@{/products/{productId}(
                   productId=${product.id}
               )}">

            <!-- 대표 이미지가 있는 경우 -->
            <img class="placeholder-image product-card__image"
                 th:if="${product.thumbnailUrl != null
                           and !product.thumbnailUrl.isBlank()}"
                 th:src="${product.thumbnailUrl}"
                 th:alt="${product.name}">

            <!-- 대표 이미지가 없는 경우 -->
            <div class="placeholder-image product-card__image"
                 th:unless="${product.thumbnailUrl != null
                               and !product.thumbnailUrl.isBlank()}">
              상품 이미지 준비 중
            </div>

            <div class="product-card__body">
              <h3 class="product-card__name"
                  th:text="${product.name}">
                상품명
              </h3>

              <p class="product-card__price">
                  <span th:text="${#numbers.formatInteger(
                      product.basePrice,
                      1,
                      'COMMA'
                  )}">
                    0
                  </span>원
              </p>

              <div class="cluster">
                <!-- 상품 유형 -->
                <span class="badge"
                      th:text="${product.productType.displayName}">
                    상품 유형
                  </span>

                <!-- 품절 -->
                <span class="badge badge--danger"
                      th:if="${product.outOfStock}">
                    품절
                  </span>

                <!-- 재고 제한 없음 -->
                <span class="badge badge--success"
                      th:if="${product.unlimitedStock}">
                    주문 가능
                  </span>

                <!-- 재고 있음 -->
                <span class="badge badge--success"
                      th:if="${product.available
                               and !product.unlimitedStock}">
                    재고 있음
                  </span>
              </div>
            </div>
          </a>
        </div>

        <!-- 검색 결과가 없는 경우 -->
        <div class="panel panel--dashed text-muted"
             th:if="${pageResult.content.isEmpty()}"
             style="text-align:center; margin-top:12px">

          조건에 맞는 상품이 없습니다.
        </div>

        <!-- 페이지네이션 -->
        <nav class="cluster"
             th:if="${pageResult.totalPages > 1}"
             aria-label="페이지 이동"
             style="justify-content:center; margin-top:16px">

          <!-- 이전 페이지 -->
          <a class="btn"
             th:if="${pageResult.page > 1}"
             th:href="@{/products(
                   keyword=${condition.keyword},
                   type=${condition.type},
                   minPrice=${condition.minPrice},
                   maxPrice=${condition.maxPrice},
                   stock=${condition.stock},
                   sort=${condition.sort},
                   page=${pageResult.page - 1},
                   size=${pageResult.size}
               )}">
            이전
          </a>

          <span class="btn btn--disabled"
                th:unless="${pageResult.page > 1}">
              이전
            </span>

          <!-- 페이지 번호 -->
          <a class="btn"
             th:each="pageNumber :
                   ${#numbers.sequence(1, pageResult.totalPages)}"
             th:text="${pageNumber}"
             th:classappend="${pageNumber == pageResult.page}
                   ? ' is-active'"
             th:href="@{/products(
                   keyword=${condition.keyword},
                   type=${condition.type},
                   minPrice=${condition.minPrice},
                   maxPrice=${condition.maxPrice},
                   stock=${condition.stock},
                   sort=${condition.sort},
                   page=${pageNumber},
                   size=${pageResult.size}
               )}">
            1
          </a>

          <!-- 다음 페이지 -->
          <a class="btn"
             th:if="${pageResult.page < pageResult.totalPages}"
             th:href="@{/products(
                   keyword=${condition.keyword},
                   type=${condition.type},
                   minPrice=${condition.minPrice},
                   maxPrice=${condition.maxPrice},
                   stock=${condition.stock},
                   sort=${condition.sort},
                   page=${pageResult.page + 1},
                   size=${pageResult.size}
               )}">
            다음
          </a>

          <span class="btn btn--disabled"
                th:unless="${pageResult.page
                              < pageResult.totalPages}">
              다음
            </span>
        </nav>
      </section>
    </div>
  </form>
</main>

<footer th:replace="~{fragments/common/footer :: footer(${store})}">
</footer>
</body>
</html>
