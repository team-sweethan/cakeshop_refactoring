<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/mypage-layout.css}">
  <link rel="stylesheet" th:href="@{/css/chat-room.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/chat-customer.js}"></script>
  <script defer th:src="@{/js/korea-time.js}"></script>
</head>
<body data-page-title="1:1 채팅 문의">
  <header th:replace="~{fragments/common/header :: header}"></header>

  <!--/* 마이페이지 하위 화면: 왼쪽에 마이페이지 메뉴(공용 조각), 오른쪽에 내 주문 · 채팅창 두 칸.
         채팅 두 칸은 화면 높이에 맞춘 고정 높이다(chat-room.css). 메시지와 주문 목록은 각자 안에서 스크롤하고,
         입력창은 늘 채팅창 맨 아래에 있다. 페이지가 대화 길이에 따라 늘어나지 않는다. */-->
  <main class="page-container chat-page">
    <h1>1:1 채팅 문의</h1>
    <div class="layout-sidebar mypage-layout">
    <nav th:replace="~{fragments/customer/mypage-nav :: mypageNav('chat')}"></nav>
    <div class="mypage-content">

    <!-- 2열 레이아웃: 관련 주문 사이드바(좌) + 채팅방 패널(우) -->
    <div class="chat-layout">
      <!-- 좌측 사이드바: 연동 주문 목록. 진행 중 주문이 위, 지난 주문은 접어 둔다(chat-customer.js) -->
      <aside class="panel chat-sidebar" aria-labelledby="chat-orders-title">
        <div class="chat-sidebar__head">
          <strong class="chat-sidebar__title" id="chat-orders-title">
            내 주문 <span class="chat-sidebar__count" data-chat-order-count></span>
          </strong>
          <p class="chat-sidebar__hint">카드를 누르면 대화에서 그 주문 위치로 이동합니다.</p>
        </div>

        <div class="stack chat-sidebar__list">
          <p class="chat-sidebar__empty">주문 내역을 불러오는 중입니다...</p>
        </div>
      </aside>

      <!-- 우측 채팅방 패널 -->
      <div class="panel chat-room">
        <!-- 채팅방 헤더 -->
        <div class="chat-room__header cluster cluster--between">
          <div>
            <strong>케이크 전문점 1:1 상담</strong>
            <p class="text-muted">실시간 1:1 대화방 (상태: <span class="badge badge--success">상담 가능</span>)</p>
          </div>
          <a class="btn btn--outline" th:href="@{/products}">상품 둘러보기</a>
        </div>

        <!-- 채팅 타임라인 (chat-messages) -->
        <div class="chat-messages" id="chatMessages">
          <div class="text-muted empty-chat-notice" style="text-align:center; padding:30px;">아직 주고받은 메시지가 없습니다. 문의사항을 남겨보세요!</div>
        </div>

        <!-- 채팅 입력 영역 (채팅방 안쪽에 위치) -->
        <div class="chat-input-area">
          <form class="chat-input-form" id="chatForm">
            <div class="chat-input-toolbar cluster">
              <label class="btn btn--outline" style="cursor:pointer;">
                📷 이미지 첨부
                <input type="file" accept="image/*" style="display:none;" id="chatImageInput">
              </label>
              <span class="text-muted" id="imageFileName">선택된 파일 없음</span>
            </div>
            <div class="chat-input-row">
              <textarea class="form-control" id="chatInput" placeholder="메시지를 입력하세요..." rows="2"></textarea>
              <button type="submit" class="btn btn--primary" style="height:56px; padding:0 20px;">전송</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    </div>
    </div>
  </main>

  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
