<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문서 | 스윗한 케이크</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
  <script defer th:src="@{/js/order-checkout.js}"></script>
</head>
<body data-page-title="주문서">
  <header th:replace="~{fragments/common/header :: header}"></header>

  <main class="page-container">
    <h1>주문서 작성</h1>

    <form class="layout-main-aside"
          method="post"
          th:action="@{/orders/general}"
          th:object="${orderForm}">
      <input type="hidden" th:field="*{productId}">
      <input type="hidden" th:field="*{quantity}">
      <input type="hidden" th:field="*{requestKey}">
      <input type="hidden" th:field="*{displayedOriginalAmount}">
      <input th:each="option : ${checkout.selectedOptions}"
             type="hidden"
             name="optionIds"
             th:value="${option.id}">

      <div class="stack">
        <p class="form-error"
           th:if="${#fields.hasGlobalErrors()}"
           th:errors="*{global}">
          상품 가격이 변경되었습니다. 주문 금액을 다시 확인해 주세요.
        </p>

        <section>
          <h2 class="section-title">주문 상품</h2>
          <div class="panel stack" data-order-items>
            <div>
              <strong th:text="${checkout.productName}">상품명</strong>
              <p class="text-muted"
                 th:text="|${checkout.productTypeLabel} · ${checkout.quantity}개|">
                일반 케이크 · 1개
              </p>
            </div>

            <div th:if="${!checkout.selectedOptions.isEmpty()}">
              <div class="data-row"
                   th:each="option : ${checkout.selectedOptions}">
                <span class="data-row__label"
                      th:text="${option.groupName}">옵션</span>
                <span>
                  <span th:text="${option.name}">옵션명</span>
                  <span th:text="|(+${#numbers.formatInteger(option.additionalPrice, 1, 'COMMA')}원)|">
                    (+0원)
                  </span>
                </span>
              </div>
            </div>
          </div>
        </section>

        <section>
          <h2 class="section-title">픽업 일시</h2>
          <div class="panel stack" data-pickup-scheduler>
            <div class="form-group" th:if="${!checkout.pickupDates.isEmpty()}">
              <label class="form-label" for="pickupDate">픽업 날짜</label>
              <select class="form-control" id="pickupDate" data-pickup-date>
                <option th:each="pickupDate : ${checkout.pickupDates}"
                        th:value="${pickupDate.date}"
                        th:text="${pickupDate.label}">
                  8월 5일 (수)
                </option>
              </select>
            </div>

            <fieldset class="pickup-choice"
                      th:each="pickupDate, dateStat : ${checkout.pickupDates}"
                      th:attr="data-pickup-time-panel=${pickupDate.date}"
                      th:hidden="${!dateStat.first}">
              <legend class="form-label">픽업 시간</legend>
              <div class="grid grid--4 pickup-choice__times">
                <span th:each="pickupTime, timeStat : ${pickupDate.times}">
                  <input class="pickup-choice__input visually-hidden"
                         type="radio"
                         th:field="*{pickupAt}"
                         th:id="|pickupAt-${dateStat.index}-${timeStat.index}|"
                         th:value="${pickupTime.value}">
                  <label class="btn pickup-choice__label"
                         th:for="|pickupAt-${dateStat.index}-${timeStat.index}|"
                         th:text="${pickupTime.label}">
                    14:00
                  </label>
                </span>
              </div>
            </fieldset>
            <p class="form-error"
               th:if="${#fields.hasErrors('pickupAt')}"
               th:errors="*{pickupAt}">
              픽업 시간을 확인해 주세요.
            </p>
            <p class="note" th:if="${checkout.pickupDates.isEmpty()}">
              현재 선택 가능한 픽업 시간이 없습니다.
            </p>
          </div>
        </section>

        <section>
          <h2 class="section-title">쿠폰</h2>
          <div class="panel">
            <label class="form-label" for="memberCouponId">적용 쿠폰</label>
            <select class="form-control" id="memberCouponId" th:field="*{memberCouponId}">
              <option value="">쿠폰을 선택하지 않음</option>
              <option th:each="coupon : ${availableCoupons}"
                      th:value="${coupon.memberCouponId}"
                      th:attr="data-discount-type=${coupon.discountType},
                               data-discount-value=${coupon.discountValue},
                               data-maximum-discount-amount=${coupon.maximumDiscountAmount}"
                      th:text="${coupon.name}">쿠폰명</option>
            </select>
          </div>
        </section>

        <section>
          <h2 class="section-title">주문자 정보</h2>
          <div class="panel">
            <div class="form-group">
              <label class="form-label" for="ordererName">
                주문자 이름 <span class="required">*</span>
              </label>
              <input class="form-control"
                     id="ordererName"
                     th:field="*{ordererName}"
                     maxlength="50"
                     required>
              <p class="form-error"
                 th:if="${#fields.hasErrors('ordererName')}"
                 th:errors="*{ordererName}"></p>
            </div>

            <div class="form-group">
              <label class="form-label" for="ordererPhone">
                주문자 전화번호 <span class="required">*</span>
              </label>
              <input class="form-control"
                     id="ordererPhone"
                     type="tel"
                     th:field="*{ordererPhone}"
                     maxlength="30"
                     required>
              <p class="form-error"
                 th:if="${#fields.hasErrors('ordererPhone')}"
                 th:errors="*{ordererPhone}"></p>
            </div>

            <div class="form-group">
              <label class="cluster" for="sameAsOrderer">
                <input id="sameAsOrderer"
                       type="checkbox"
                       data-same-as-orderer
                       th:checked="${orderForm.ordererName == orderForm.pickupName
                           and orderForm.ordererPhone == orderForm.pickupPhone}">
                <span>픽업자가 주문자와 같습니다.</span>
              </label>
            </div>

            <h3 class="form-label">픽업자 정보</h3>

            <div class="form-group">
              <label class="form-label" for="pickupName">
                픽업자 이름 <span class="required">*</span>
              </label>
              <input class="form-control"
                     id="pickupName"
                     th:field="*{pickupName}"
                     maxlength="50"
                     required>
              <p class="form-error"
                 th:if="${#fields.hasErrors('pickupName')}"
                 th:errors="*{pickupName}"></p>
            </div>

            <div class="form-group">
              <label class="form-label" for="pickupPhone">
                픽업자 전화번호 <span class="required">*</span>
              </label>
              <input class="form-control"
                     id="pickupPhone"
                     type="tel"
                     th:field="*{pickupPhone}"
                     maxlength="30"
                     required>
              <p class="form-error"
                 th:if="${#fields.hasErrors('pickupPhone')}"
                 th:errors="*{pickupPhone}"></p>
            </div>
          </div>
        </section>

        <section>
          <h2 class="section-title">픽업 요청사항</h2>
          <div class="panel">
            <label class="form-label" for="requestMessage">요청사항</label>
            <textarea class="form-control form-control--textarea"
                      id="requestMessage"
                      th:field="*{requestMessage}"
                      maxlength="1000"
                      placeholder="픽업 시 특이사항 또는 요청사항 입력"></textarea>
            <p class="form-error"
               th:if="${#fields.hasErrors('requestMessage')}"
               th:errors="*{requestMessage}"></p>
          </div>
        </section>
      </div>

      <aside class="order-summary">
        <h2 class="section-title">결제 금액</h2>
        <div class="data-row" data-order-total th:attr="data-original-amount=${checkout.totalAmount}">
          <span class="data-row__label">쿠폰 할인</span>
          <span data-coupon-discount>0원</span>
        </div>
        <div class="data-row">
          <span class="data-row__label">상품 금액</span>
          <span th:text="|${#numbers.formatInteger(checkout.productAmount, 1, 'COMMA')}원|">
            0원
          </span>
        </div>
        <div class="data-row">
          <span class="data-row__label">옵션 추가</span>
          <span th:text="|${#numbers.formatInteger(checkout.optionAmount, 1, 'COMMA')}원|">
            0원
          </span>
        </div>
        <div class="data-row">
          <span class="data-row__label">예상 최종 결제 금액</span>
          <strong data-final-amount th:text="|${#numbers.formatInteger(checkout.totalAmount, 1, 'COMMA')}원|">
            0원
          </strong>
        </div>
        <button class="btn btn--primary btn--block"
                type="submit"
                th:disabled="${checkout.pickupDates.isEmpty()}"
                style="margin-top:12px">
          결제하기
        </button>
      </aside>
    </form>
  </main>

  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
