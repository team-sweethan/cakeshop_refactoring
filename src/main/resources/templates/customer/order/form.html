<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문서 | 스윗한 케이크</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
  <script defer th:src="@{/js/order-checkout.js}"></script>
</head>
<body data-page-title="주문서">
  <header th:replace="~{fragments/common/header :: header}"></header>

  <main class="page-container">
    <h1>주문서 작성</h1>

    <!--/* 왼쪽은 번호 붙은 카드 세 장(픽업 일시 · 주문자와 픽업자 · 요청사항), 오른쪽은 주문 요약.
           주문 요약은 내용 높이만큼만 그리고 스크롤해도 화면에 붙어 따라온다(.checkout-summary). */-->
    <form class="layout-main-aside checkout-layout"
          method="post"
          th:action="@{/orders/general}"
          th:object="${orderForm}">
      <input type="hidden" th:field="*{productId}">
      <input type="hidden" th:field="*{quantity}">
      <input type="hidden" th:field="*{requestKey}">
      <input type="hidden" th:field="*{displayedOriginalAmount}">
      <input th:each="option : ${checkout.selectedOptions}"
             type="hidden"
             name="optionIds"
             th:value="${option.id}">

      <div class="stack checkout-steps">
        <p class="form-error"
           th:if="${#fields.hasGlobalErrors()}"
           th:errors="*{global}">
          상품 가격이 변경되었습니다. 주문 금액을 다시 확인해 주세요.
        </p>

        <!--/* ① 픽업 일시 */-->
        <section class="checkout-card checkout-picker-card" aria-labelledby="checkout-step-pickup">
          <h2 class="checkout-card__title" id="checkout-step-pickup">
            <span class="checkout-card__step" aria-hidden="true">1</span>
            픽업 일시
          </h2>
          <div class="stack" data-pickup-picker>
            <!--/* 날짜는 달력, 시간은 시 → 분 버튼으로 고른다. 달력과 버튼은 order-checkout.js가 아래 픽업 시각
                   라디오(서버가 준 실제 가능 시각)를 읽어 그리고, 고르면 그 라디오를 대신 체크한다. 보내는 값은 그대로다.
                   스크립트가 돌지 않으면 아래 날짜별 시각 버튼이 그대로 보여 직접 고를 수 있다. */-->
            <!--/* 고르지 않고 결제하기를 누르면 카드 맨 위에 크게 보인다. 카드에도 빨간 테두리가 생긴다. */-->
            <p class="checkout-alert" data-pickup-picker-error role="alert" hidden>
              픽업 날짜와 시간을 선택해 주세요.
            </p>
            <div class="checkout-picker" data-pickup-picker-ui hidden>
              <div class="checkout-calendar" data-pickup-calendar></div>
              <div class="checkout-clock">
                <p class="checkout-clock__label" id="pickup-hour-label">시간</p>
                <div class="checkout-clock__hours" role="group" aria-labelledby="pickup-hour-label"
                     data-pickup-hours></div>
                <p class="checkout-clock__label" id="pickup-minute-label">분</p>
                <div class="checkout-clock__minutes" role="group" aria-labelledby="pickup-minute-label"
                     data-pickup-minutes></div>
              </div>
            </div>
            <p class="checkout-picker__summary" data-pickup-summary aria-live="polite" hidden></p>

            <!--/* 실제로 보내는 픽업 시각 라디오. 스크립트가 돌면 숨긴다(.checkout-picker-ready). */-->
            <fieldset class="pickup-choice checkout-fallback-times"
                      th:each="pickupDate, dateStat : ${checkout.pickupDates}"
                      th:attr="data-pickup-time-panel=${pickupDate.date},
                               data-pickup-date-label=${pickupDate.label}">
              <legend class="form-label" th:text="${pickupDate.label}">8월 5일 (수)</legend>
              <div class="pickup-choice__times checkout-times">
                <span th:each="pickupTime, timeStat : ${pickupDate.times}">
                  <input class="pickup-choice__input visually-hidden"
                         type="radio"
                         th:field="*{pickupAt}"
                         th:id="|pickupAt-${dateStat.index}-${timeStat.index}|"
                         th:value="${pickupTime.value}">
                  <label class="btn pickup-choice__label"
                         th:for="|pickupAt-${dateStat.index}-${timeStat.index}|"
                         th:text="${pickupTime.label}">
                    14:00
                  </label>
                </span>
              </div>
            </fieldset>
            <p class="form-error"
               th:if="${#fields.hasErrors('pickupAt')}"
               th:errors="*{pickupAt}">
              픽업 시간을 확인해 주세요.
            </p>
            <p class="note" th:if="${checkout.pickupDates.isEmpty()}">
              현재 선택 가능한 픽업 시간이 없습니다.
            </p>
          </div>
        </section>

        <!--/* ② 주문자 · 픽업자 */-->
        <section class="checkout-card" aria-labelledby="checkout-step-contact">
          <h2 class="checkout-card__title" id="checkout-step-contact">
            <span class="checkout-card__step" aria-hidden="true">2</span>
            주문자 · 픽업자
          </h2>

          <div class="checkout-fields">
            <div class="form-group">
              <label class="form-label" for="ordererName">
                주문자 이름 <span class="required">*</span>
              </label>
              <input class="form-control"
                     id="ordererName"
                     th:field="*{ordererName}"
                     maxlength="50"
                     required>
              <p class="form-error"
                 th:if="${#fields.hasErrors('ordererName')}"
                 th:errors="*{ordererName}"></p>
            </div>

            <div class="form-group">
              <label class="form-label" for="ordererPhone">
                주문자 전화번호 <span class="required">*</span>
              </label>
              <input class="form-control"
                     id="ordererPhone"
                     type="tel"
                     th:field="*{ordererPhone}"
                     maxlength="30"
                     required>
              <p class="form-error"
                 th:if="${#fields.hasErrors('ordererPhone')}"
                 th:errors="*{ordererPhone}"></p>
            </div>
          </div>

          <div class="form-group checkout-same">
            <label class="cluster" for="sameAsOrderer">
              <input id="sameAsOrderer"
                     type="checkbox"
                     data-same-as-orderer
                     aria-controls="checkout-pickup-contact"
                     th:checked="${orderForm.ordererName == orderForm.pickupName
                         and orderForm.ordererPhone == orderForm.pickupPhone}">
              <span>픽업자가 주문자와 같습니다.</span>
            </label>
          </div>

          <!--/* 체크되어 있으면 접는다. 값은 스크립트가 주문자 값으로 채워 함께 보낸다.
                 서버가 픽업자 칸에 오류를 돌려주면 체크와 상관없이 펼친다(order-checkout.js). */-->
          <div class="checkout-pickup-contact" id="checkout-pickup-contact" data-pickup-contact>
            <h3 class="form-label">픽업자 정보</h3>
            <div class="checkout-fields">
              <div class="form-group">
                <label class="form-label" for="pickupName">
                  픽업자 이름 <span class="required">*</span>
                </label>
                <input class="form-control"
                       id="pickupName"
                       th:field="*{pickupName}"
                       maxlength="50"
                       required>
                <p class="form-error"
                   th:if="${#fields.hasErrors('pickupName')}"
                   th:errors="*{pickupName}"></p>
              </div>

              <div class="form-group">
                <label class="form-label" for="pickupPhone">
                  픽업자 전화번호 <span class="required">*</span>
                </label>
                <input class="form-control"
                       id="pickupPhone"
                       type="tel"
                       th:field="*{pickupPhone}"
                       maxlength="30"
                       required>
                <p class="form-error"
                   th:if="${#fields.hasErrors('pickupPhone')}"
                   th:errors="*{pickupPhone}"></p>
              </div>
            </div>
          </div>
        </section>

        <!--/* ③ 요청사항 */-->
        <section class="checkout-card" aria-labelledby="checkout-step-request">
          <h2 class="checkout-card__title" id="checkout-step-request">
            <span class="checkout-card__step" aria-hidden="true">3</span>
            요청사항 <span class="checkout-card__optional">(선택)</span>
          </h2>
          <label class="visually-hidden" for="requestMessage">픽업 요청사항</label>
          <textarea class="form-control checkout-request"
                    id="requestMessage"
                    th:field="*{requestMessage}"
                    rows="2"
                    maxlength="1000"
                    placeholder="픽업 시 특이사항 또는 요청사항 입력"></textarea>
          <p class="form-error"
             th:if="${#fields.hasErrors('requestMessage')}"
             th:errors="*{requestMessage}"></p>
        </section>
      </div>

      <!--/* 주문 요약: 주문 상품 · 금액 · 쿠폰 · 결제 버튼. 쿠폰은 금액에 바로 영향을 주므로 여기서 고른다. */-->
      <aside class="order-summary checkout-summary" aria-labelledby="checkout-summary-title">
        <h2 class="checkout-summary__title" id="checkout-summary-title">주문 요약</h2>

        <div class="checkout-summary__product" data-order-items>
          <strong th:text="${checkout.productName}">상품명</strong>
          <span class="text-muted"
                th:text="|${checkout.productTypeLabel} · ${checkout.quantity}개|">
            일반 케이크 · 1개
          </span>
          <ul class="checkout-summary__options" th:if="${!checkout.selectedOptions.isEmpty()}">
            <li th:each="option : ${checkout.selectedOptions}">
              <span th:text="|${option.groupName}: ${option.name}|">옵션</span>
              <span th:text="|+${#numbers.formatInteger(option.additionalPrice, 1, 'COMMA')}원|">+0원</span>
            </li>
          </ul>
        </div>

        <!--/* 고른 픽업 일시. 고르기 전에는 "아직 선택 안 함"이라 결제하기 전에 할 일이 보인다(order-checkout.js가 채움). */-->
        <div class="data-row checkout-summary__pickup">
          <span class="data-row__label">픽업 일시</span>
          <span class="checkout-summary__pickup-value is-empty" data-pickup-summary-value>아직 선택 안 함</span>
        </div>

        <div class="data-row">
          <span class="data-row__label">상품 금액</span>
          <span th:text="|${#numbers.formatInteger(checkout.productAmount, 1, 'COMMA')}원|">
            0원
          </span>
        </div>
        <div class="data-row" th:if="${checkout.optionAmount.signum() > 0}">
          <span class="data-row__label">옵션 추가</span>
          <span th:text="|+${#numbers.formatInteger(checkout.optionAmount, 1, 'COMMA')}원|">
            +0원
          </span>
        </div>

        <div class="form-group checkout-summary__coupon">
          <label class="form-label" for="memberCouponId">쿠폰</label>
          <select class="form-control" id="memberCouponId" th:field="*{memberCouponId}">
            <option value="">쿠폰을 선택하지 않음</option>
            <option th:each="coupon : ${availableCoupons}"
                    th:value="${coupon.memberCouponId}"
                    th:attr="data-discount-type=${coupon.discountType},
                             data-discount-value=${coupon.discountValue},
                             data-maximum-discount-amount=${coupon.maximumDiscountAmount}"
                    th:text="${coupon.name}">쿠폰명</option>
          </select>
        </div>

        <div class="data-row" data-order-total th:attr="data-original-amount=${checkout.totalAmount}">
          <span class="data-row__label">쿠폰 할인</span>
          <span data-coupon-discount>0원</span>
        </div>

        <div class="checkout-summary__total">
          <span>최종 결제 금액</span>
          <strong data-final-amount th:text="|${#numbers.formatInteger(checkout.totalAmount, 1, 'COMMA')}원|">
            0원
          </strong>
        </div>

        <button class="btn btn--primary btn--block checkout-summary__submit"
                type="submit"
                th:disabled="${checkout.pickupDates.isEmpty()}">
          결제하기
        </button>
        <!--/* 픽업 일시 없이 결제하기를 누르면 누른 자리 바로 아래에 이유를 보인다. */-->
        <p class="checkout-alert checkout-summary__alert" data-pickup-submit-error role="alert" hidden>
          픽업 날짜와 시간을 먼저 선택해 주세요.
        </p>
      </aside>
    </form>
  </main>

  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
