<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문 제작 옵션 | 스윗한 케이크</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body data-page-title="주문 제작 옵션">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container page-container--narrow">
    <h1>주문 제작 옵션 입력</h1>

    <section class="section">
      <h2 class="section-title">상품 정보</h2>
      <div class="panel">
        <strong th:text="${customProduct.productName}">상품명</strong>
        <p class="text-muted"
           th:text="|기본 ${#numbers.formatInteger(customProduct.basePrice, 1, 'COMMA')}원 · 제작 ${customProduct.preparationDays}일|">
          기본 금액
        </p>
      </div>
    </section>

    <form id="custom-option-form" method="get" th:action="@{/orders/custom/request}">
      <input type="hidden" name="productId" th:value="${customProduct.productId}">
      <section class="section">
        <h2 class="section-title">제작 옵션</h2>
        <div class="panel stack">
          <fieldset th:each="group, groupStat : ${optionGroups}"
                    th:classappend="${group.required and group.selectionType == 'MULTIPLE'} ? ' js-required-multiple' : ''">
            <legend class="form-label">
              <span th:text="${group.name}">옵션</span>
              <span class="required" th:if="${group.required}">*</span>
            </legend>
            <div class="choice-list">
              <label class="choice" th:each="option, optionStat : ${group.options}">
                <input th:type="${group.selectionType == 'MULTIPLE' ? 'checkbox' : 'radio'}"
                       th:name="|customOptionGroup-${group.id}|"
                       th:value="${option.id}"
                       data-custom-option
                       th:required="${group.required and group.selectionType != 'MULTIPLE' and optionStat.first}">
                <span th:text="${option.name}">옵션명</span>
                <span th:if="${option.additionalPrice.signum() > 0}"
                      th:text="| +${#numbers.formatInteger(option.additionalPrice, 1, 'COMMA')}원|">
                  +0원
                </span>
              </label>
            </div>
          </fieldset>
        </div>
      </section>
      <button class="btn btn--primary" type="submit">주문 정보 입력</button>
    </form>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
  <script>
    const customOptionForm = document.getElementById("custom-option-form");

    customOptionForm.addEventListener("change", function (event) {
      const requiredMultipleGroup = event.target.closest(".js-required-multiple");
      if (requiredMultipleGroup) {
        requiredMultipleGroup.querySelector("input[data-custom-option]").setCustomValidity("");
      }
    });

    customOptionForm.addEventListener("submit", function (event) {
      let invalidOption = null;
      this.querySelectorAll(".js-required-multiple").forEach((group) => {
        const firstOption = group.querySelector("input[data-custom-option]");
        if (!firstOption) {
          return;
        }
        const selected = group.querySelector("input[data-custom-option]:checked");
        firstOption.setCustomValidity(selected ? "" : "필수 옵션을 하나 이상 선택하세요.");
        if (!selected && !invalidOption) {
          invalidOption = firstOption;
        }
      });
      if (invalidOption) {
        event.preventDefault();
        invalidOption.reportValidity();
        return;
      }
      this.querySelectorAll("[data-selected-option]").forEach((input) => input.remove());
      this.querySelectorAll("input[data-custom-option]:checked").forEach((input) => {
        const hidden = document.createElement("input");
        hidden.type = "hidden";
        hidden.name = "optionIds";
        hidden.value = input.value;
        hidden.dataset.selectedOption = "";
        this.append(hidden);
      });
    });
  </script>
</body>
</html>
