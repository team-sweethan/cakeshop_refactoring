<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수제 케이크 주문 요청 | 스윗한 케이크</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/order-checkout.js}"></script>
</head>
<body data-page-title="수제 케이크 주문 요청">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container page-container--narrow">
    <h1>수제 케이크 주문 요청</h1>
    <form method="post" th:action="@{/orders/custom}" th:object="${orderForm}">
      <input type="hidden" th:field="*{productId}">
      <input type="hidden" th:field="*{requestKey}">
      <input type="hidden" th:field="*{displayedOriginalAmount}">
      <input th:each="option : ${checkout.selectedOptions}"
             type="hidden" name="optionIds" th:value="${option.id}">

      <section class="section">
        <h2 class="section-title">상품 및 제작 옵션</h2>
        <div class="panel stack">
          <strong th:text="${checkout.productName}">상품명</strong>
          <p class="text-muted" th:text="|제작 준비 기간 ${checkout.preparationDays}일|">준비 기간</p>
          <div class="data-row" th:each="option : ${checkout.selectedOptions}">
            <span class="data-row__label" th:text="${option.groupName}">옵션</span>
            <span th:text="|${option.name} (+${#numbers.formatInteger(option.additionalPrice, 1, 'COMMA')}원)|">
              옵션명
            </span>
          </div>
          <div class="form-group">
            <label class="form-label" for="lettering">레터링 문구</label>
            <input class="form-control" id="lettering" th:field="*{lettering}" maxlength="100">
            <p class="form-error" th:if="${#fields.hasErrors('lettering')}" th:errors="*{lettering}"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="requestMessage">제작 요청사항</label>
            <textarea class="form-control form-control--textarea" id="requestMessage"
                      th:field="*{requestMessage}" maxlength="1000"></textarea>
            <p class="form-error" th:if="${#fields.hasErrors('requestMessage')}" th:errors="*{requestMessage}"></p>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">픽업 일시</h2>
        <div class="panel">
          <label class="form-label" for="pickupAt">픽업 일시 <span class="required">*</span></label>
          <select class="form-control" id="pickupAt" th:field="*{pickupAt}" required>
            <option value="">픽업 일시를 선택하세요</option>
            <optgroup th:each="pickupDate : ${checkout.pickupDates}" th:label="${pickupDate.label}">
              <option th:each="pickupTime : ${pickupDate.times}"
                      th:value="${pickupTime.value}"
                      th:text="${pickupTime.label}">14:00</option>
            </optgroup>
          </select>
          <p class="form-error" th:if="${#fields.hasErrors('pickupAt')}" th:errors="*{pickupAt}"></p>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">쿠폰</h2>
        <div class="panel">
          <label class="form-label" for="memberCouponId">적용 쿠폰</label>
          <select class="form-control" id="memberCouponId" th:field="*{memberCouponId}">
            <option value="">쿠폰을 선택하지 않음</option>
            <option th:each="coupon : ${availableCoupons}"
                    th:value="${coupon.memberCouponId}"
                    th:attr="data-discount-type=${coupon.discountType},
                             data-discount-value=${coupon.discountValue},
                             data-maximum-discount-amount=${coupon.maximumDiscountAmount}"
                    th:text="${coupon.name}">
              쿠폰
            </option>
          </select>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">주문자·픽업자 정보</h2>
        <div class="panel stack">
          <div class="form-group">
            <label class="form-label" for="ordererName">주문자 이름 <span class="required">*</span></label>
            <input class="form-control" id="ordererName" th:field="*{ordererName}" maxlength="50" required>
            <p class="form-error" th:if="${#fields.hasErrors('ordererName')}" th:errors="*{ordererName}"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="ordererPhone">주문자 연락처 <span class="required">*</span></label>
            <input class="form-control" id="ordererPhone" type="tel" th:field="*{ordererPhone}" maxlength="30" required>
            <p class="form-error" th:if="${#fields.hasErrors('ordererPhone')}" th:errors="*{ordererPhone}"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="pickupName">픽업자 이름 <span class="required">*</span></label>
            <input class="form-control" id="pickupName" th:field="*{pickupName}" maxlength="50" required>
            <p class="form-error" th:if="${#fields.hasErrors('pickupName')}" th:errors="*{pickupName}"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="pickupPhone">픽업자 연락처 <span class="required">*</span></label>
            <input class="form-control" id="pickupPhone" type="tel" th:field="*{pickupPhone}" maxlength="30" required>
            <p class="form-error" th:if="${#fields.hasErrors('pickupPhone')}" th:errors="*{pickupPhone}"></p>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">주문 금액</h2>
        <div class="panel">
          <div class="data-row">
            <span class="data-row__label">주문 금액</span>
            <strong th:text="|${#numbers.formatInteger(checkout.totalAmount, 1, 'COMMA')}원|">0원</strong>
          </div>
          <div class="data-row" data-order-total
               th:attr="data-original-amount=${checkout.totalAmount}">
            <span class="data-row__label">쿠폰 할인</span>
            <span data-coupon-discount>0원</span>
          </div>
          <div class="data-row">
            <span class="data-row__label">최종 결제 금액</span>
            <strong data-final-amount
                    th:text="|${#numbers.formatInteger(checkout.totalAmount, 1, 'COMMA')}원|">0원</strong>
          </div>
        </div>
      </section>

      <button class="btn btn--primary btn--block" type="submit">결제 준비하기</button>
    </form>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
