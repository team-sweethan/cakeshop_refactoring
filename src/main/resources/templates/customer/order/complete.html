<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문 완료 | 스윗한 케이크</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body data-page-title="주문 완료">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container page-container--form">
    <h1 class="visually-hidden">주문 완료</h1>
    <section class="panel" style="padding:32px;text-align:center">
      <h2 style="font-size:20px">결제와 주문이 완료되었습니다.</h2>
      <p class="text-muted section" th:text="|주문번호: ${completion.orderNumber}|">
        주문번호
      </p>

      <div style="text-align:left">
        <h3 class="section-title">주문 정보</h3>
        <div class="data-row" th:each="item : ${completion.items}">
          <span class="data-row__label">상품</span>
          <span th:text="|${item.productName} × ${item.quantity}|">상품 × 1</span>
        </div>
        <div class="data-row">
          <span class="data-row__label">결제 금액</span>
          <span th:text="|${#numbers.formatInteger(completion.amount, 1, 'COMMA')}원|">0원</span>
        </div>
        <div class="data-row">
          <span class="data-row__label">결제 수단</span>
          <span th:text="${completion.method}">카드</span>
        </div>
        <div class="data-row">
          <span class="data-row__label">픽업 일시</span>
          <span th:text="${#temporals.format(completion.pickupAt, 'yyyy.MM.dd (E) HH:mm')}">
            픽업 일시
          </span>
        </div>
        <div class="data-row">
          <span class="data-row__label">픽업 장소</span>
          <span th:text="${completion.pickupPlace}">픽업 장소</span>
        </div>
      </div>

      <div class="cluster" style="justify-content:center;margin-top:16px">
        <a class="btn"
           th:href="@{/orders/{id}(id=${completion.orderId})}">
          주문 상세 보기
        </a>
        <a class="btn btn--primary" th:href="@{/}">메인으로</a>
      </div>
    </section>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
