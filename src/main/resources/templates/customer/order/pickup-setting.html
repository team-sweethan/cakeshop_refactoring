<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일반 주문 설정 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body data-page-title="일반 주문 설정">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container page-container--narrow" data-pickup-root>
    <div class="panel panel--dashed text-muted section" role="note">
      장바구니 픽업 일시 수정 흐름을 확인하기 위한 목업 화면입니다. 표시된 상품, 가격, 날짜와 시간은 실제 주문 데이터가 아닙니다.
    </div>
    <h1>픽업 일시 선택</h1><section class="section"><h2 class="section-title">선택 상품</h2><div class="panel cluster"><div class="placeholder-image placeholder-image--sm">상품 이미지</div><div><strong>딸기 생크림 케이크</strong><p class="text-muted">35,000원</p><div class="quantity-control" data-quantity data-min="1" data-max="10"><button class="btn" type="button" data-quantity-change="-1" aria-label="수량 감소">−</button><output class="panel quantity-control__value" data-quantity-value>1</output><button class="btn" type="button" data-quantity-change="1" aria-label="수량 증가">+</button></div></div></div></section>
    <section class="section"><h2 class="section-title">픽업 날짜 선택</h2><div class="panel"><label class="form-label" for="pickup-date">픽업 가능일 <span class="required">*</span></label><input class="form-control" id="pickup-date" type="date" value="2025-01-17" required><p class="note">픽업 가능 기간: 주문일로부터 2일 후 ~ 14일 이내</p></div></section>
    <section class="section"><h2 class="section-title">픽업 시간 선택</h2><div class="panel grid grid--4" data-select-group><button class="btn" data-select type="button">10:00</button><button class="btn" data-select type="button">11:00</button><button class="btn btn--disabled" disabled type="button">12:00</button><button class="btn btn--disabled" disabled type="button">13:00</button><button class="btn" data-select type="button">14:00</button><button class="btn" data-select type="button">15:00</button><button class="btn" data-select type="button">16:00</button><button class="btn" data-select type="button">17:00</button><p class="note">비활성 = 선택 불가 시간 (마감/휴무)</p></div></section>
    <section class="section"><h2 class="section-title">예상 금액</h2><div class="panel"><div class="data-row"><span class="data-row__label">상품 금액</span><span data-pickup-price>35,000원 × 1개</span></div><div class="data-row"><span class="data-row__label">예상 합계</span><strong data-pickup-total>35,000원</strong></div></div></section><div class="panel panel--dashed text-muted section">비로그인 상태: 로그인 페이지 이동 후 이전 화면 복귀 (복귀: 픽업 일시 선택)</div><div class="cluster"><a class="btn btn--primary" href="/orders/checkout" data-pickup-order-link>주문서 작성하기</a><button class="btn" type="button" disabled>장바구니 연동 준비 중</button></div><p class="form-error" data-pickup-error role="alert" hidden></p>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
