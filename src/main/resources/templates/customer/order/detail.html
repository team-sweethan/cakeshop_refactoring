<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문 내역 | 스윗한 케이크</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body data-page-title="주문 내역">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container">
    <div class="page-heading cluster cluster--between">
      <h1>주문 내역</h1>
      <a class="btn" th:href="@{/mypage}">마이페이지로 돌아가기</a>
    </div>
    <div class="grid grid--3">
      <aside>
        <h2 class="section-title">주문 목록</h2>
        <p class="panel" th:if="${#lists.isEmpty(orders)}">아직 주문 내역이 없습니다.</p>
        <div class="stack" th:unless="${#lists.isEmpty(orders)}">
          <a class="panel order-history-card" th:each="summary : ${orders}"
             th:href="@{/orders/{id}(id=${summary.orderId})}">
            <span class="order-history-card__header">
              <span class="text-muted order-history-card__number"
                    th:text="${summary.orderNumber}"
                    th:title="${summary.orderNumber}">ORD-001</span>
              <span class="badge" th:text="${summary.statusLabel}">결제 대기</span>
            </span>
            <strong class="order-history-card__product"
                    th:text="${summary.productName}">상품명</strong>
            <span class="text-muted" th:if="${summary.itemCount > 1}"
                  th:text="' 외 ' + ${summary.itemCount - 1} + '건'">외 1건</span>
            <p class="text-muted order-history-card__date"
               th:text="${#temporals.format(summary.createdAt, 'yyyy.MM.dd HH:mm')}">
              2026.08.02 12:00
            </p>
          </a>
        </div>
      </aside>

      <section class="order-history-detail" th:if="${order != null}">
        <h2 class="section-title order-history-detail__title"
            th:text="'주문 상세 - ' + ${order.orderNumber}">주문 상세</h2>
        <div class="panel">
          <div class="data-row"><span class="data-row__label">주문 상태</span>
            <strong th:text="${order.statusLabel}">결제 대기</strong></div>
          <div class="data-row"><span class="data-row__label">주문 일시</span>
            <span th:text="${#temporals.format(order.createdAt, 'yyyy.MM.dd HH:mm')}">2026.08.02 12:00</span></div>
          <div class="data-row"><span class="data-row__label">픽업 일시</span>
            <span th:text="${#temporals.format(order.pickupAt, 'yyyy.MM.dd HH:mm')}">2026.08.03 12:00</span></div>
          <div class="data-row"><span class="data-row__label">픽업자</span>
            <span th:text="${order.pickupName + ' / ' + order.pickupPhone}">픽업자</span></div>

          <h3 class="section-title">주문 상품</h3>
          <article class="panel" th:each="item : ${order.items}">
            <strong th:text="${item.productName}">상품명</strong>
            <p th:text="${item.quantity + '개 · ' + #numbers.formatInteger(item.totalAmount, 1, 'COMMA') + '원'}">
              1개 · 30,000원
            </p>
            <ul th:unless="${#lists.isEmpty(item.options)}">
              <li th:each="option : ${item.options}"
                  th:text="${option.groupName + ': ' + option.optionName}">크기: 2호</li>
            </ul>
          </article>

          <div class="data-row"><span class="data-row__label">상품 금액</span>
            <span th:text="${#numbers.formatInteger(order.originalAmount, 1, 'COMMA') + '원'}">0원</span></div>
          <div class="data-row"><span class="data-row__label">할인 금액</span>
            <span th:text="${'-' + #numbers.formatInteger(order.discountAmount, 1, 'COMMA') + '원'}">-0원</span></div>
          <div class="data-row"><span class="data-row__label">최종 결제</span>
            <strong th:text="${#numbers.formatInteger(order.finalAmount, 1, 'COMMA') + '원'}">0원</strong></div>
          <div class="cluster" th:if="${order.paymentPending}">
            <a class="btn btn--primary" th:href="@{/orders/{id}/payment(id=${order.orderId})}">결제하기</a>
          </div>
          <form class="stack" th:if="${order.cancelRequestAvailable}" method="post"
                th:action="@{/orders/{id}/cancel(id=${order.orderId})}">
            <label for="cancel-reason">취소 사유</label>
            <textarea class="form-control form-control--textarea" id="cancel-reason" name="reason"
                      maxlength="200" required></textarea>
            <button class="btn btn--danger" type="submit">주문 취소</button>
            <p class="note" th:text="${order.customerCancellationGuide()}">
              일반 상품은 픽업 예정 시각 전까지 전액 취소할 수 있습니다.
            </p>
          </form>
        </div>
      </section>
      <section class="order-history-detail" th:if="${order == null}">
        <div class="panel">왼쪽 목록에서 확인할 주문을 선택해 주세요.</div>
      </section>
    </div>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
