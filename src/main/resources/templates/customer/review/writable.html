<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>작성할 후기 | 스윗한 케이크</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body data-page-title="작성할 후기">
  <header th:replace="~{fragments/common/header :: header}"></header>

  <main class="page-container">
    <div class="page-heading cluster cluster--between">
      <h1>작성할 후기</h1>
      <a class="btn" th:href="@{/mypage}">마이페이지로 돌아가기</a>
    </div>

    <section class="section">
      <p class="text-muted"
         th:if="${writableItems.content.isEmpty()}">
        작성할 후기가 없습니다.
      </p>

      <div class="stack"
           th:unless="${writableItems.content.isEmpty()}">

        <div class="panel cluster"
             th:each="item : ${writableItems.content}"
             style="justify-content:space-between">

          <div>
            <strong th:text="${item.productName}">상품명</strong>
            <p class="text-muted">
              <span th:text="${item.orderNumber}">주문번호</span>
              <span th:if="${item.pickedUpAt != null}">
                | 픽업
                <span th:text="${#temporals.format(item.pickedUpAt, 'yyyy-MM-dd')}">날짜</span>
              </span>
            </p>
          </div>

          <a class="btn btn--primary"
             th:href="@{/reviews/new(orderItemId=${item.orderItemId})}">
            후기 쓰기
          </a>
        </div>
      </div>
    </section>

    <nav th:if="${writableItems.totalPages > 1}"
         class="cluster section"
         aria-label="페이지 이동"
         style="justify-content:center">

      <a class="btn"
         th:if="${pageNavigation.hasPreviousBlock}"
         th:href="@{/mypage/reviews/writable(page=${pageNavigation.previousPage})}">
        이전
      </a>

      <span class="btn btn--disabled"
            th:unless="${pageNavigation.hasPreviousBlock}">
        이전
      </span>

      <a class="btn"
         th:each="pageNumber : ${#numbers.sequence(pageNavigation.startPage, pageNavigation.endPage)}"
         th:classappend="${pageNumber == writableItems.page} ? ' btn--primary' : ''"
         th:href="@{/mypage/reviews/writable(page=${pageNumber})}"
         th:text="${pageNumber}">1</a>

      <a class="btn"
         th:if="${pageNavigation.hasNextBlock}"
         th:href="@{/mypage/reviews/writable(page=${pageNavigation.nextPage})}">
        다음
      </a>

      <span class="btn btn--disabled"
            th:unless="${pageNavigation.hasNextBlock}">
        다음
      </span>
    </nav>
  </main>

  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
