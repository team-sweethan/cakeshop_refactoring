<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 후기 | 스윗한 케이크</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/mypage-layout.css}">
  <link rel="stylesheet" th:href="@{/css/review.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body data-page-title="내 후기">
  <header th:replace="~{fragments/common/header :: header}"></header>

  <!--/* 마이페이지 하위 화면: 왼쪽에 마이페이지 메뉴(공용 조각, "작성할 후기"도 여기 있다), 오른쪽에 내가 쓴 후기 */-->
  <main class="page-container">
    <h1>내 후기</h1>
    <div class="layout-sidebar mypage-layout">
      <nav th:replace="~{fragments/customer/mypage-nav :: mypageNav('reviews')}"></nav>
      <div class="mypage-content">

    <section class="section">
      <div class="mypage-empty" th:if="${reviews.content.isEmpty()}">
        <p class="mypage-empty__title">작성한 후기가 없습니다.</p>
        <p class="mypage-empty__desc">픽업을 마친 주문 상품에 후기를 남겨 보세요.</p>
        <a class="btn" th:href="@{/mypage/reviews/writable}">작성할 후기 보기</a>
      </div>

      <div class="stack" th:unless="${reviews.content.isEmpty()}">
        <div class="panel stack review-row"
             th:each="review : ${reviews.content}"
             th:id="'review-' + ${review.id}">
          <div class="cluster" style="justify-content:space-between">
            <div>
              <a th:href="@{/products/{id}/reviews(id=${review.productId})}"
                 th:text="${review.productName}">상품명</a>
              <p class="text-muted" th:text="${review.orderNumber}">주문번호</p>
            </div>
            <div class="cluster">
              <span class="badge badge--warning" th:if="${review.blocked}"
                    th:text="${review.status.label}">상태</span>
              <span class="text-muted"
                    th:text="${#temporals.format(review.createdAt, 'yyyy-MM-dd')}">2026-08-10</span>
            </div>
          </div>

          <p class="text-muted">
            전체 <span th:text="${review.overallRating}">5</span>점 ·
            맛 <span th:text="${review.tasteRating}">5</span>점 ·
            디자인 <span th:text="${review.designRating}">5</span>점 ·
            응대 <span th:text="${review.serviceRating}">5</span>점
          </p>

          <p style="white-space:pre-wrap" th:text="${review.content}">후기 본문</p>

          <div th:replace="~{fragments/customer/product-review :: images(${review.images})}"></div>

          <div th:replace="~{fragments/customer/product-review :: reply(${review.reply})}"></div>

          <div class="cluster" th:unless="${review.blocked}">
            <a class="btn" th:href="@{/reviews/{id}/edit(id=${review.id})}">수정</a>

            <form method="post"
                  th:action="@{/reviews/{id}/delete(id=${review.id})}"
                  onsubmit="return confirm('삭제하면 이 주문 상품에는 다시 후기를 작성할 수 없습니다. 삭제하시겠습니까?');">
              <button class="btn btn--danger" type="submit">삭제</button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <nav th:if="${reviews.totalPages > 1}"
         class="cluster section"
         aria-label="페이지 이동"
         style="justify-content:center">

      <a class="btn"
         th:if="${pageNavigation.hasPreviousBlock}"
         th:href="@{/mypage/reviews(page=${pageNavigation.previousPage})}">
        이전
      </a>

      <span class="btn btn--disabled"
            th:unless="${pageNavigation.hasPreviousBlock}">
        이전
      </span>

      <a class="btn"
         th:each="pageNumber : ${#numbers.sequence(pageNavigation.startPage, pageNavigation.endPage)}"
         th:classappend="${pageNumber == reviews.page} ? ' btn--primary' : ''"
         th:href="@{/mypage/reviews(page=${pageNumber})}"
         th:text="${pageNumber}">1</a>

      <a class="btn"
         th:if="${pageNavigation.hasNextBlock}"
         th:href="@{/mypage/reviews(page=${pageNavigation.nextPage})}">
        다음
      </a>

      <span class="btn btn--disabled"
            th:unless="${pageNavigation.hasNextBlock}">
        다음
      </span>
    </nav>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
