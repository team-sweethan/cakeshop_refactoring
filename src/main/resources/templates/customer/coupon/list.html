<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보유 쿠폰 | 스윗한 케이크</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/mypage-layout.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
  <header th:replace="~{fragments/common/header :: header}"></header>

  <!--/* 마이페이지 하위 화면: 왼쪽에 마이페이지 메뉴(공용 조각), 오른쪽에 쿠폰 목록 */-->
  <main class="page-container">
    <h1 class="visually-hidden">보유 쿠폰</h1>
    <div class="layout-sidebar mypage-layout">
      <nav th:replace="~{fragments/customer/mypage-nav :: mypageNav('coupons')}"></nav>
      <div class="mypage-content">

    <section class="section">
      <div class="mypage-empty" th:if="${coupons.content.isEmpty()}">
        <p class="mypage-empty__title">보유한 쿠폰이 없습니다.</p>
        <p class="mypage-empty__desc">쿠폰을 받으면 여기에서 확인하고, 주문서에서 바로 쓸 수 있습니다.</p>
        <a class="btn btn--primary" th:href="@{/products}">상품 보러 가기</a>
      </div>

      <div class="stack" th:unless="${coupons.content.isEmpty()}">
        <article class="coupon-card" th:each="coupon : ${coupons.content}">
          <div class="cluster cluster--between">
            <div>
              <strong th:text="${coupon.name}">쿠폰명</strong>
              <p style="font-size:16px;font-weight:700" th:text="${coupon.discountDescription}">
                할인 내용
              </p>
              <p class="text-muted" th:text="${coupon.conditionDescription}">사용 조건</p>
            </div>
            <span class="badge"
                  th:classappend="${coupon.status.name() == 'AVAILABLE'} ? ' badge--success' : ''"
                  th:text="${coupon.status.description}">
              쿠폰 상태
            </span>
          </div>
          <p class="text-muted">
            발급일:
            <span th:text="${#temporals.format(coupon.issuedAt, 'yyyy-MM-dd HH:mm')}">발급일</span>
          </p>
          <p class="text-muted">
            사용 기한:
            <span th:text="${#temporals.format(coupon.expiresAt, 'yyyy-MM-dd HH:mm')}">사용 기한</span>
          </p>
        </article>
      </div>
    </section>

    <nav th:if="${coupons.totalPages > 1}"
         class="cluster section"
         aria-label="쿠폰 페이지 이동"
         style="justify-content:center">
      <a class="btn"
         th:if="${pageNavigation.hasPreviousBlock}"
         th:href="@{/mypage/coupons(page=${pageNavigation.previousPage})}">이전</a>

      <a class="btn"
         th:each="pageNumber : ${#numbers.sequence(pageNavigation.startPage, pageNavigation.endPage)}"
         th:classappend="${pageNumber == coupons.page} ? ' btn--primary' : ''"
         th:href="@{/mypage/coupons(page=${pageNumber})}"
         th:text="${pageNumber}">1</a>

      <a class="btn"
         th:if="${pageNavigation.hasNextBlock}"
         th:href="@{/mypage/coupons(page=${pageNavigation.nextPage})}">다음</a>
    </nav>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
