<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장바구니 | 스윗한 케이크</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/cart.js}"></script>
</head>
<body data-page-title="장바구니">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container">
    <div th:replace="~{fragments/common/alert :: alert}"></div>
    <h1>장바구니</h1>

    <section class="panel panel--dashed cart-empty" th:if="${cart.empty}">
      <p>장바구니가 비어 있습니다.</p>
      <a class="btn" th:href="@{/products}">상품 보러 가기</a>
    </section>

    <div class="cart-layout" th:unless="${cart.empty}">
      <div>
        <section class="panel cart-toolbar">
          <form id="cart-selection-form"
                th:action="@{/cart/items/delete-selected}"
                method="post">
            <div class="cluster">
              <label class="cluster" for="cart-select-all">
                <input id="cart-select-all" type="checkbox" data-cart-select-all checked>
                <span>전체 선택</span>
              </label>
              <button class="btn" type="submit">선택 삭제</button>
            </div>
          </form>
          <form th:action="@{/cart/items/delete-all}" method="post">
            <button class="btn btn--danger" type="submit"
                    onclick="return confirm('장바구니를 모두 비울까요?')">전체 삭제</button>
          </form>
        </section>

        <section class="stack cart-items">
          <article class="panel cart-item" data-cart-item
                   th:each="item : ${cart.items}"
                   th:attr="data-item-id=${item.id},
                            data-available=${item.available},
                            data-base-price=${item.basePrice},
                            data-option-price=${item.optionPrice},
                            data-unit-price=${item.basePrice.add(item.optionPrice)}"
                   th:classappend="${!item.available} ? ' is-disabled'">
            <label class="cart-item__check">
              <input type="checkbox" name="itemIds"
                     th:value="${item.id}"
                     form="cart-selection-form"
                     data-cart-item-select
                     th:checked="${item.available}"
                     th:disabled="${!item.available}">
              <span class="visually-hidden" th:text="|${item.productName} 선택|">상품 선택</span>
            </label>
            <a class="placeholder-image placeholder-image--sm cart-item__image"
               th:classappend="${item.thumbnailUrl != null} ? ' cart-item__image--has-thumbnail'"
               th:style="${item.thumbnailUrl != null} ? |background-image: url('${item.thumbnailUrl}')| : null"
               th:attr="aria-label=${item.productName}"
               th:href="@{/products/{id}(id=${item.productId})}">상품 이미지</a>
            <div class="cart-item__body">
              <div class="cluster cluster--between">
                <div>
                  <a class="cart-item__name"
                     th:href="@{/products/{id}(id=${item.productId})}"
                     th:text="${item.productName}">상품명</a>
                  <div class="cluster cart-item__badges">
                    <span class="badge badge--info"
                          th:text="${item.productType.displayName}">상품 유형</span>
                    <span class="badge"
                          data-cart-item-status
                          th:classappend="${item.available} ? ' badge--success' : ' badge--danger'"
                          th:text="${item.available} ? '주문 가능' : '재고 부족 또는 판매 중지'">상태</span>
                  </div>
                </div>
                <form th:action="@{/cart/items/{id}/delete(id=${item.id})}" method="post">
                  <button class="btn btn--danger" type="submit">삭제</button>
                </form>
              </div>

              <p class="text-muted"
                 th:text="|기본 가격: ${#numbers.formatInteger(item.basePrice, 1, 'COMMA')}원|">기본 가격</p>
              <div class="cart-options" th:if="${!item.options.isEmpty()}">
                <strong>선택 옵션</strong>
                <div th:each="option : ${item.options}"
                     th:text="|${option.name} (+${#numbers.formatInteger(option.additionalPrice, 1, 'COMMA')}원)|">
                  옵션
                </div>
              </div>
              <p class="text-muted" th:if="${item.requirements != null}"
                 th:text="|요청사항: ${item.requirements}|">요청사항</p>

              <div class="cluster cart-item__bottom">
                <form class="quantity-control"
                      data-cart-quantity-form
                      th:action="@{/cart/items/{id}/quantity(id=${item.id})}"
                      method="post">
                  <button class="btn" type="button" data-cart-quantity-change="-1"
                          th:disabled="${item.quantity <= 1}" aria-label="수량 감소">−</button>
                  <input class="form-control" type="number" name="quantity" min="1"
                         th:max="${item.stockQuantity != null ? item.stockQuantity : 10}"
                         th:value="${item.quantity}"
                         aria-label="수량">
                  <button class="btn" type="button" data-cart-quantity-change="1"
                          th:disabled="${item.quantity >= (item.stockQuantity != null
                                  ? item.stockQuantity : 10)}"
                          aria-label="수량 증가">+</button>
                </form>
                <strong class="cart-item__price"
                        data-cart-item-total
                        th:text="|${#numbers.formatInteger(item.totalPrice, 1, 'COMMA')}원|">합계</strong>
              </div>
            </div>
          </article>
        </section>
        <div class="cart-continue"><a class="btn" th:href="@{/products}">← 쇼핑 계속하기</a></div>
      </div>

      <aside class="order-summary cart-summary">
        <h2 class="section-title">주문 요약</h2>
        <div class="data-row"><span class="data-row__label">상품 종류</span><span data-cart-item-count th:text="|${cart.itemCount}종|">0종</span></div>
        <div class="data-row"><span class="data-row__label">총 상품 금액</span><span data-cart-base-total th:text="|${#numbers.formatInteger(cart.baseTotal, 1, 'COMMA')}원|">0원</span></div>
        <div class="data-row"><span class="data-row__label">총 옵션 금액</span><span data-cart-option-total th:text="|${#numbers.formatInteger(cart.optionTotal, 1, 'COMMA')}원|">0원</span></div>
        <div class="data-row cart-summary__total"><span class="data-row__label">예상 결제 금액</span><strong data-cart-grand-total th:text="|${#numbers.formatInteger(cart.grandTotal, 1, 'COMMA')}원|">0원</strong></div>
        <p class="note">쿠폰 할인은 주문서에서 적용됩니다.</p>
        <button class="btn btn--primary btn--block"
                type="submit"
                form="cart-selection-form"
                formmethod="get"
                th:formaction="@{/orders/checkout/cart}">
          주문서 작성
        </button>
      </aside>
    </div>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
