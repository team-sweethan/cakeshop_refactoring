기능 : 고객 커뮤니티 화면
설명 : list 커뮤니티 화면을 구성한다.
******************************
*/-->
<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커뮤니티 | 스윗한 케이크</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/community.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body data-page-title="커뮤니티">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container">

    <div th:replace="~{fragments/common/alert :: alert}"></div>

    <h1>커뮤니티</h1>

    <div class="section" th:classappend="${!popularSection.isEmpty()} ? 'layout-main-aside'">
      <div>
        <div class="cluster section" th:if="${selectedKeyword != null}">
          <span class="text-muted" th:text="|'${selectedKeyword}' 검색 결과|">검색 결과</span>
          <a class="btn"
             th:href="@{/community(categoryId=${selectedCategoryId}, sort=${selectedSort})}">검색 해제</a>
        </div>

        <!--/* 카테고리 탭(왼쪽)과 정렬(오른쪽)을 한 줄에 둔다. 좁은 화면에서는 두 줄로 내려간다. */-->
        <div class="community-toolbar section">
          <nav class="community-tabs" aria-label="카테고리">
            <a class="community-tabs__item"
               th:classappend="${selectedCategoryId == null} ? ' is-active'"
               th:aria-current="${selectedCategoryId == null} ? 'page'"
               th:href="@{/community(keyword=${selectedKeyword}, sort=${selectedSort})}">전체</a>

            <a class="community-tabs__item"
               th:each="category : ${categories}"
               th:with="selected=${selectedCategoryId != null and selectedCategoryId == category.id}"
               th:text="${category.name}"
               th:classappend="${selected} ? ' is-active'"
               th:aria-current="${selected} ? 'page'"
               th:href="@{/community(categoryId=${category.id}, keyword=${selectedKeyword}, sort=${selectedSort})}">카테고리</a>
          </nav>

          <nav class="community-sort" aria-label="정렬">
            <a class="community-sort__item"
               th:each="sortOption : ${sortOptions}"
               th:classappend="${selectedSort == sortOption} ? ' is-active'"
               th:aria-current="${selectedSort == sortOption} ? 'true'"
               th:href="@{/community(categoryId=${selectedCategoryId}, keyword=${selectedKeyword}, sort=${sortOption.parameter})}"
               th:text="${sortOption.label}">정렬</a>
          </nav>
        </div>

        <div class="stack section">
          <article class="panel" th:each="post : ${pageResult.content}">
            <div class="cluster cluster--between">
              <div class="cluster">
                <span class="badge badge--info" th:text="${post.categoryName}">카테고리</span>
                <a th:href="@{/community/{postId}(postId=${post.id})}">
                  <strong th:text="${post.title}">제목</strong>
                </a>
              </div>
              <span class="text-muted" th:text="'좋아요 ' + ${post.likeCount}">좋아요 0</span>
            </div>
            <p class="text-muted">
              <span th:text="${post.authorName()}">작성자</span> ·
              <span th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd')}">2026.01.01</span> ·
              <span th:text="'댓글 ' + ${post.commentCount}">댓글 0</span> ·
              <span th:text="'조회 ' + ${post.viewCount}">조회 0</span>
            </p>
          </article>

          <div class="panel panel--dashed text-muted"
               th:if="${pageResult.content.isEmpty()}"
               style="text-align:center">
            <span th:if="${selectedKeyword != null}"
                  th:text="|'${selectedKeyword}' 로 찾은 글이 없습니다.|">검색 결과 없음</span>
            <span th:unless="${selectedKeyword != null}">아직 등록된 글이 없습니다.</span>
          </div>
        </div>

        <nav th:if="${pageResult.totalPages > 1}"
             class="cluster section"
             aria-label="페이지 이동"
             style="justify-content:center">

          <a class="btn"
             th:if="${pageNavigation.hasPreviousBlock}"
             th:href="@{/community(
                 categoryId=${selectedCategoryId},
                 keyword=${selectedKeyword},
                 sort=${selectedSort},
                 page=${pageNavigation.previousPage}
             )}">
            이전
          </a>

          <span class="btn btn--disabled"
                th:unless="${pageNavigation.hasPreviousBlock}">
            이전
          </span>

          <a class="btn"
             th:each="pageNumber :
                 ${#numbers.sequence(
                     pageNavigation.startPage,
                     pageNavigation.endPage
                 )}"
             th:text="${pageNumber}"
             th:classappend="${pageNumber == pageResult.page} ? ' is-active'"
             th:href="@{/community(
                 categoryId=${selectedCategoryId},
                 keyword=${selectedKeyword},
                 sort=${selectedSort},
                 page=${pageNumber}
             )}">
            1
          </a>

          <a class="btn"
             th:if="${pageNavigation.hasNextBlock}"
             th:href="@{/community(
                 categoryId=${selectedCategoryId},
                 keyword=${selectedKeyword},
                 sort=${selectedSort},
                 page=${pageNavigation.nextPage}
             )}">
            다음
          </a>

          <span class="btn btn--disabled"
                th:unless="${pageNavigation.hasNextBlock}">
            다음
          </span>
        </nav>

        <!--/* 검색과 글쓰기는 목록 끝에 둔다. 훑어보다 못 찾았을 때 손이 닿는 자리다
               (specs/community-read.md B6). */-->
        <div class="cluster cluster--between section">
          <form class="cluster" method="get" th:action="@{/community}" role="search">
            <input type="hidden" name="categoryId" th:if="${selectedCategoryId != null}"
                   th:value="${selectedCategoryId}">
            <input type="hidden" name="sort" th:value="${selectedSort}">
            <label class="visually-hidden" for="keyword">게시글 검색</label>
            <input class="input" type="search" id="keyword" name="keyword"
                   placeholder="제목과 내용에서 찾기"
                   th:value="${selectedKeyword}">
            <button class="btn btn--primary" type="submit">검색</button>
          </form>

          <a class="btn btn--primary" sec:authorize="!hasRole('ADMIN')"
             th:href="@{/community/new}">글쓰기</a>
        </div>
      </div>

      <aside class="stack" th:if="${!popularSection.isEmpty()}">
        <div class="cluster">
          <h2>인기글</h2>
          <span class="text-muted">
            <span th:text="${#temporals.format(popularSection.rankingDate, 'yyyy.MM.dd')}">2026.01.01</span> 기준
          </span>
        </div>

        <div class="stack">
          <a class="panel cluster"
             th:each="popular : ${popularSection.posts}"
             th:href="@{/community/{postId}(postId=${popular.postId})}">
            <span class="text-muted" th:text="${popular.ranking}">1</span>
            <span class="badge badge--info" th:text="${popular.categoryName}">카테고리</span>
            <strong th:text="${popular.title}">제목</strong>
          </a>
        </div>
      </aside>
    </div>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
