<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${editingPostId} != null ? '글 수정 | 스윗한 케이크' : '글쓰기 | 스윗한 케이크'">글쓰기 | 스윗한 케이크</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body th:attr="data-page-title=${editingPostId} != null ? '글 수정' : '글쓰기'">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container page-container--form">

    <h1 th:text="${editingPostId} != null ? '글 수정' : '글쓰기'">글쓰기</h1>

    <form method="post"
          enctype="multipart/form-data"
          th:object="${form}"
          th:action="${editingPostId} != null
                     ? @{/community/{postId}/edit(postId=${editingPostId})}
                     : @{/community}">
      <div class="form-group">
        <label class="form-label" for="categoryId">분류 <span class="required">*</span></label>
        <select class="form-control" id="categoryId" th:field="*{categoryId}" required>
          <option value="">선택하세요</option>
          <option th:each="category : ${categories}"
                  th:value="${category.id}"
                  th:text="${category.name}">분류</option>
        </select>
        <p class="field-error" th:errors="*{categoryId}"></p>
      </div>
      <div class="form-group">
        <label class="form-label" for="title">제목 <span class="required">*</span></label>
        <input class="form-control" id="title" type="text" th:field="*{title}"
               placeholder="제목을 입력하세요" maxlength="100" required>
        <p class="field-error" th:errors="*{title}"></p>
      </div>
      <div class="form-group">
        <label class="form-label" for="content">내용 <span class="required">*</span></label>
        <textarea class="form-control form-control--textarea" id="content" th:field="*{content}"
                  style="min-height:220px" placeholder="내용을 입력하세요"
                  maxlength="5000" required></textarea>
        <p class="field-error" th:errors="*{content}"></p>
      </div>

      <!--/* 첨부는 본문 안이 아니라 목록이다. 규칙은 docs/community/specs/community-post.md A4. */-->
      <div class="form-group">
        <label class="form-label" for="images">이미지</label>

        <div class="stack" th:if="${!#lists.isEmpty(postImages)}">
          <label class="cluster" th:each="image : ${postImages}">
            <input type="checkbox" name="deleteImageIds" th:value="${image.id}">
            <img class="thumb" th:src="@{${image.imageUrl}}" alt="첨부 이미지" style="max-width:120px">
            <span class="text-muted">지우기</span>
          </label>
        </div>

        <input class="form-control" id="images" type="file" name="images"
               multiple accept="image/jpeg,image/png">
        <p class="note">JPG·PNG만, 한 장에 5MB까지, 게시글당 5장까지 올릴 수 있습니다.</p>
        <p class="field-error" th:errors="*{images}"></p>
      </div>

      <div class="cluster cluster--between section">
        <a class="btn" th:href="${editingPostId} != null
                                ? @{/community/{postId}(postId=${editingPostId})}
                                : @{/community}">취소</a>
        <button class="btn btn--primary" type="submit"
                th:text="${editingPostId} != null ? '수정' : '등록'">등록</button>
      </div>
    </form>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
