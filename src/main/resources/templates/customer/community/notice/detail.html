<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${notice.title} + ' | 스윗한 케이크'">공지사항 | 스윗한 케이크</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/community.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body data-page-title="공지사항">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container">

    <div th:replace="~{fragments/common/alert :: alert}"></div>

    <div class="cluster cluster--between">
      <h1>공지사항</h1>
      <a class="btn" th:href="@{/community/notices}">목록으로</a>
    </div>

    <article class="panel stack section">
      <h2 th:text="${notice.title}">제목</h2>
      <p class="text-muted"
         th:text="${#temporals.format(notice.displayedAt, 'yyyy.MM.dd')}">2026.01.01</p>
      <div class="post-body">
        <p th:text="${notice.content}">본문</p>
      </div>
    </article>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
