<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 | 스윗한 케이크</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/customer-mockup.js}"></script>
</head>
<body data-page-title="공지사항">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container">

    <div th:replace="~{fragments/common/alert :: alert}"></div>

    <div class="cluster cluster--between">
      <h1>공지사항</h1>
      <a class="btn" th:href="@{/community}">커뮤니티로</a>
    </div>

    <div class="stack">
      <a class="panel cluster cluster--between"
         th:each="notice : ${pageResult.content}"
         th:href="@{/community/notices/{noticeId}(noticeId=${notice.id})}">
        <strong th:text="${notice.title}">제목</strong>
        <span class="text-muted"
              th:text="${#temporals.format(notice.displayedAt, 'yyyy.MM.dd')}">2026.01.01</span>
      </a>

      <div class="panel panel--dashed text-muted"
           th:if="${pageResult.content.isEmpty()}"
           style="text-align:center">
        아직 등록된 공지사항이 없습니다.
      </div>
    </div>

    <nav th:if="${pageResult.totalPages > 1}"
         class="cluster section"
         aria-label="페이지 이동"
         style="justify-content:center">

      <a class="btn"
         th:if="${pageNavigation.hasPreviousBlock}"
         th:href="@{/community/notices(page=${pageNavigation.previousPage})}">
        이전
      </a>

      <span class="btn btn--disabled" th:unless="${pageNavigation.hasPreviousBlock}">이전</span>

      <a class="btn"
         th:each="pageNumber :
             ${#numbers.sequence(pageNavigation.startPage, pageNavigation.endPage)}"
         th:text="${pageNumber}"
         th:classappend="${pageNumber == pageResult.page} ? ' is-active'"
         th:href="@{/community/notices(page=${pageNumber})}">
        1
      </a>

      <a class="btn"
         th:if="${pageNavigation.hasNextBlock}"
         th:href="@{/community/notices(page=${pageNavigation.nextPage})}">
        다음
      </a>

      <span class="btn btn--disabled" th:unless="${pageNavigation.hasNextBlock}">다음</span>
    </nav>
  </main>
  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
