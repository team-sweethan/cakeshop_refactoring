<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 승인 중 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body data-page-title="결제 승인 중">
  <header th:replace="~{fragments/common/header :: header}"></header>
  <main class="page-container page-container--narrow">
    <section class="panel" style="padding:32px;text-align:center">
      <h1>결제를 승인하고 있습니다.</h1>
      <p class="text-muted">창을 닫거나 새로고침하지 말고 잠시 기다려 주세요.</p>

      <form id="payment-confirm-form"
            method="post"
            th:action="@{/orders/{id}/payment/confirm(id=${orderId})}"
            th:object="${paymentForm}">
        <input type="hidden" th:field="*{paymentKey}">
        <input type="hidden" th:field="*{gatewayOrderId}">
        <input type="hidden" th:field="*{amount}">
        <noscript>
          <button class="btn btn--primary" type="submit">결제 승인 계속하기</button>
        </noscript>
      </form>
    </section>
  </main>
  <script>
    document.getElementById("payment-confirm-form").submit();
  </script>
</body>
</html>
