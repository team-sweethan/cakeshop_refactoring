<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 | 스윗한 케이크</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/payment-checkout.css}">
  <script defer src="https://js.tosspayments.com/v2/standard"></script>
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/payment.js}"></script>
</head>
<body data-page-title="결제">
  <header th:replace="~{fragments/common/header :: header}"></header>

  <!--/* 왼쪽은 주문 내역과 결제 수단, 오른쪽은 금액 · 남은 시간 · 동의 · 결제하기(헤더 아래에 붙어 따라온다).
         결제 수단은 이 화면에서 바로 고른다. 결제하기를 누르면 고른 결제사로 바로 진행한다(payment.js). */-->
  <main class="page-container"
        id="payment-root"
        th:attr="data-client-key=${payment.tossClientKey},
                 data-gateway-order-id=${payment.gatewayOrderId},
                 data-order-name=${payment.orderName},
                 data-payment-amount=${payment.amount},
                 data-customer-name=${payment.customerName},
                 data-customer-email=${payment.customerEmail},
                 data-customer-phone=${payment.customerPhone},
                 data-success-url=@{/orders/{id}/payment/success(id=${payment.orderId})},
                 data-fail-url=@{/orders/{id}/payment/fail(id=${payment.orderId})}">
    <h1>결제</h1>

    <div class="layout-main-aside payment-layout">
      <div class="stack payment-main">
        <section class="payment-card" aria-labelledby="payment-order-title">
          <h2 class="payment-card__title" id="payment-order-title">주문 내역</h2>
          <ul class="payment-items">
            <li class="payment-items__item" th:each="item : ${payment.items}">
              <strong th:text="|${item.productName} × ${item.quantity}|">상품 × 1</strong>
              <span class="text-muted" th:unless="${item.options.isEmpty()}">
                <span th:each="option, optionStat : ${item.options}"
                      th:text="|${option.groupName}: ${option.optionName}${optionStat.last ? '' : ' · '}|">옵션</span>
              </span>
            </li>
          </ul>
          <div class="data-row">
            <span class="data-row__label">픽업 일시</span>
            <strong th:text="${#temporals.format(payment.pickupAt, 'yyyy.MM.dd (E) HH:mm')}">픽업 일시</strong>
          </div>
          <div class="data-row payment-order-number">
            <span class="data-row__label">주문번호</span>
            <span class="text-muted" th:text="${payment.orderNumber}">주문번호</span>
          </div>
        </section>

        <!--/* 결제 수단: 쓸 수 있는 결제사를 바로 고른다. 하나뿐이면 미리 골라 둔다.
               못 쓰는 결제사는 흐리게 막고 이유를 한 줄로 적는다. */-->
        <section class="payment-card" aria-labelledby="payment-method-title"
                 th:if="${payment.amount.signum() > 0}">
          <h2 class="payment-card__title" id="payment-method-title">결제 수단</h2>
          <fieldset class="payment-methods">
            <legend class="visually-hidden">결제 수단 선택</legend>

            <label class="payment-method payment-method--donworry"
                   th:classappend="${!payment.donWorryAvailable} ? ' is-unavailable'">
              <input class="payment-method__input"
                     type="radio"
                     name="paymentGateway"
                     value="donworry"
                     data-payment-gateway
                     th:disabled="${!payment.donWorryAvailable}"
                     th:checked="${payment.donWorryAvailable}">
              <span class="payment-method__body">
                <span class="payment-method__name">
                  돈워리 안전결제
                  <span class="payment-method__badge" th:if="${payment.donWorryAvailable}">추천</span>
                </span>
                <span class="payment-method__desc" th:if="${payment.donWorryAvailable}">
                  카드번호가 쇼핑몰에 남지 않는 안전결제입니다. 결제 보안 확인을 위해 이메일 · 접속 IP · 기기 정보가 사용됩니다.
                </span>
                <span class="payment-method__desc" th:unless="${payment.donWorryAvailable}">
                  돈워리 연동이 꺼져 있어 사용할 수 없습니다.
                </span>
              </span>
            </label>

            <label class="payment-method"
                   th:classappend="${!payment.tossAvailable} ? ' is-unavailable'">
              <input class="payment-method__input"
                     type="radio"
                     name="paymentGateway"
                     value="toss"
                     data-payment-gateway
                     th:disabled="${!payment.tossAvailable}"
                     th:checked="${!payment.donWorryAvailable and payment.tossAvailable}">
              <span class="payment-method__body">
                <span class="payment-method__name">토스페이먼츠</span>
                <span class="payment-method__desc" th:if="${payment.tossAvailable}">카드 · 간편결제</span>
                <span class="payment-method__desc" th:unless="${payment.tossAvailable}">
                  Toss 테스트 키가 설정되지 않아 사용할 수 없습니다.
                </span>
              </span>
            </label>
          </fieldset>

          <!--/* 고른 결제사를 서버에 저장하는 요청. CSRF 값을 담기 위해 폼으로 둔다. 화면에는 보이지 않는다. */-->
          <form id="choose-toss-form"
                method="post"
                hidden
                th:action="@{/orders/{id}/payment/gateway/toss(id=${payment.orderId})}"></form>
          <form id="choose-donworry-form"
                method="post"
                hidden
                th:action="@{/orders/{id}/payment/gateway/donworry(id=${payment.orderId})}"></form>
        </section>
      </div>

      <aside class="order-summary payment-summary" aria-labelledby="payment-amount-title">
        <h2 class="payment-summary__title" id="payment-amount-title">결제 금액</h2>
        <div class="data-row">
          <span class="data-row__label">상품 금액</span>
          <span th:text="|${#numbers.formatInteger(payment.originalAmount, 1, 'COMMA')}원|">0원</span>
        </div>
        <div class="data-row" th:if="${payment.discountAmount.signum() > 0}">
          <span class="data-row__label">할인 금액</span>
          <span th:text="|-${#numbers.formatInteger(payment.discountAmount, 1, 'COMMA')}원|">-0원</span>
        </div>
        <div class="payment-summary__total">
          <span>최종 결제 금액</span>
          <strong th:text="|${#numbers.formatInteger(payment.amount, 1, 'COMMA')}원|">0원</strong>
        </div>

        <!--/* 결제 제한 시각까지 남은 시간. 스크립트가 1초마다 줄이고, 지나면 결제하기를 막는다. */-->
        <p class="payment-timer"
           data-payment-timer
           th:attr="data-expires-at=${#temporals.format(payment.paymentExpiresAt, 'yyyy-MM-dd''T''HH:mm:ss')}">
          <span class="payment-timer__label">결제 남은 시간</span>
          <strong class="payment-timer__value" data-payment-timer-value
                  th:text="${#temporals.format(payment.paymentExpiresAt, 'HH:mm')} + ' 까지'">12:00 까지</strong>
        </p>

        <label class="choice payment-agreement">
          <input id="payment-agreement" type="checkbox" required>
          주문 상품, 결제 금액, 픽업 일시를 확인했습니다. (필수)
        </label>

        <div th:if="${payment.amount.signum() > 0}"
             class="panel panel--danger"
             th:unless="${payment.paymentAvailable}">
          사용할 수 있는 결제사가 없습니다. Toss 테스트 키 또는 돈워리 연동 설정을 확인해 주세요.
        </div>
        <p class="form-error payment-error" id="payment-error" role="alert" hidden></p>

        <form th:if="${payment.amount.signum() == 0}"
              th:action="@{/orders/{id}/payment/zero(id=${payment.orderId})}"
              method="post">
          <button class="btn btn--primary btn--block payment-summary__submit" type="submit">0원 주문 완료</button>
        </form>
        <button th:if="${payment.amount.signum() > 0}"
                class="btn btn--primary btn--block payment-summary__submit"
                id="request-payment"
                type="button"
                th:disabled="${!payment.paymentAvailable}"
                th:text="|${#numbers.formatInteger(payment.amount, 1, 'COMMA')}원 결제하기|">
          결제하기
        </button>
      </aside>
    </div>

    <!--/* 돈워리를 고르고 결제하기를 누르면 열린다. 돈워리가 제공하는 결제창 주소를 iframe에 연다. 카드 선택은 돈워리 화면에서 한다. */-->
    <dialog th:if="${payment.amount.signum() > 0}"
            class="payment-modal"
            id="payment-modal"
            aria-labelledby="donworry-panel-title"
            th:attr="data-donworry-session-url=@{/orders/{id}/payment/donworry/session(id=${payment.orderId})}">
      <div class="payment-modal__donworry" id="donworry-panel">
        <div class="payment-modal__donworry-head">
          <span id="donworry-panel-title">
            돈워리 안전결제
            <span class="payment-modal__amount"
                  th:text="|${#numbers.formatInteger(payment.amount, 1, 'COMMA')}원|">0원</span>
          </span>
          <button class="payment-modal__close" type="button" data-modal-close aria-label="돈워리 결제창 닫기">×</button>
        </div>
        <iframe class="payment-modal__frame" id="donworry-frame" title="돈워리 결제창"></iframe>
      </div>
    </dialog>
  </main>

  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
