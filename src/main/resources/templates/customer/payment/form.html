<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 | 케이크 쇼핑몰</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer src="https://js.tosspayments.com/v2/standard" th:unless="${payment.donWorryCheckout}"></script>
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/payment.js}" th:unless="${payment.donWorryCheckout}"></script>
</head>
<body data-page-title="결제">
  <header th:replace="~{fragments/common/header :: header}"></header>

  <main class="page-container page-container--narrow"
        id="payment-root"
        th:attr="data-client-key=${payment.clientKey},
                 data-gateway-order-id=${payment.gatewayOrderId},
                 data-order-name=${payment.orderName},
                 data-payment-amount=${payment.amount},
                 data-customer-name=${payment.customerName},
                 data-customer-email=${payment.customerEmail},
                 data-customer-phone=${payment.customerPhone},
                 data-success-url=@{/orders/{id}/payment/success(id=${payment.orderId})},
                 data-fail-url=@{/orders/{id}/payment/fail(id=${payment.orderId})}">
    <h1>결제</h1>

    <section class="section">
      <h2 class="section-title">주문 요약</h2>
      <div class="panel stack">
        <div>
          <strong th:text="${payment.orderNumber}">주문번호</strong>
        </div>
        <article th:each="item : ${payment.items}">
          <div class="data-row">
            <span class="data-row__label">상품</span>
            <span th:text="|${item.productName} × ${item.quantity}|">상품 × 1</span>
          </div>
          <ul th:unless="${item.options.isEmpty()}">
            <li th:each="option : ${item.options}"
                th:text="|${option.groupName}: ${option.optionName}|">
              옵션
            </li>
          </ul>
        </article>
        <div class="data-row">
          <span class="data-row__label">픽업 일시</span>
          <span th:text="${#temporals.format(payment.pickupAt, 'yyyy.MM.dd (E) HH:mm')}">
            픽업 일시
          </span>
        </div>
        <div class="data-row">
          <span class="data-row__label">상품 금액</span>
          <span th:text="|${#numbers.formatInteger(payment.originalAmount, 1, 'COMMA')}원|">
            0원
          </span>
        </div>
        <div class="data-row" th:if="${payment.discountAmount.signum() > 0}">
          <span class="data-row__label">할인 금액</span>
          <span th:text="|-${#numbers.formatInteger(payment.discountAmount, 1, 'COMMA')}원|">
            -0원
          </span>
        </div>
        <div class="data-row">
          <span class="data-row__label">최종 결제 금액</span>
          <strong th:text="|${#numbers.formatInteger(payment.amount, 1, 'COMMA')}원|">
            0원
          </strong>
        </div>
        <p class="note"
           th:text="|결제 제한 시각: ${#temporals.format(payment.paymentExpiresAt, 'yyyy.MM.dd HH:mm:ss')}|">
          결제 제한 시각
        </p>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">결제 수단</h2>
      <div class="panel">
        <th:block th:unless="${payment.donWorryCheckout}">
          <strong>카드·간편결제</strong>
          <p class="text-muted">토스페이먼츠 결제창에서 카드 또는 지원되는 간편결제를 선택합니다.</p>
        </th:block>
        <th:block th:if="${payment.donWorryCheckout}">
          <strong>돈워리 안전결제</strong>
          <p class="text-muted">돈워리 결제창에서 카드를 선택합니다. 결제 보안 확인을 위해 이메일 · 접속 IP · 기기 정보가 사용됩니다.</p>
        </th:block>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">결제 진행 동의</h2>
      <div class="panel panel--soft">
        <label class="choice">
          <input id="payment-agreement" type="checkbox" required
                 th:attr="form=${payment.donWorryCheckout} ? 'donworry-open-form' : null">
          주문 상품, 결제 금액, 픽업 일시를 확인했습니다. (필수)
        </label>
      </div>
    </section>

    <div th:if="${payment.amount.signum() > 0}"
         class="panel panel--danger"
         th:unless="${payment.paymentAvailable}">
      Toss 테스트 키가 설정되지 않아 결제를 요청할 수 없습니다.
    </div>
    <p class="form-error" id="payment-error" role="alert" hidden></p>

    <form th:if="${payment.amount.signum() == 0}"
          th:action="@{/orders/{id}/payment/zero(id=${payment.orderId})}"
          method="post">
      <button class="btn btn--primary btn--block" type="submit">0원 주문 완료</button>
    </form>
    <!--/* DonWorry는 별도 결제창 화면으로 이동한다. 동의 체크박스는 form 속성으로 이 폼에 묶어 필수 검사를 받는다. */-->
    <form th:if="${payment.amount.signum() > 0 and payment.donWorryCheckout}"
          id="donworry-open-form"
          th:action="@{/orders/{id}/payment/donworry(id=${payment.orderId})}"
          method="get">
      <button class="btn btn--primary btn--block"
              type="submit"
              th:text="|${#numbers.formatInteger(payment.amount, 1, 'COMMA')}원 결제하기|">
        결제하기
      </button>
    </form>
    <button th:if="${payment.amount.signum() > 0 and !payment.donWorryCheckout}"
            class="btn btn--primary btn--block"
            id="request-payment"
            type="button"
            th:disabled="${!payment.paymentAvailable}"
            th:text="|${#numbers.formatInteger(payment.amount, 1, 'COMMA')}원 결제하기|">
      결제하기
    </button>
  </main>

  <footer th:replace="~{fragments/common/footer :: footer(${store})}"></footer>
</body>
</html>
