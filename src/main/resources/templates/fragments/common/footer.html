<footer class="customer-footer" th:fragment="footer(store)">
  <div class="customer-footer__inner">
    <div class="customer-footer__brand">
      <span class="customer-footer__eyebrow">A SWEETER MOMENT</span>
      <strong th:text="${store != null ? store.name : '케이크 쇼핑몰'}">케이크 쇼핑몰</strong>
      <p>정성스럽게 만든 케이크로<br>기억하고 싶은 하루를 완성합니다.</p>
    </div>

    <nav class="customer-footer__nav" aria-label="하단 메뉴">
      <strong>둘러보기</strong>
      <a th:href="@{/products}">전체 상품</a>
      <a th:href="@{/products(type='GENERAL')}">일반 케이크</a>
      <a th:href="@{/products(type='CUSTOM')}">주문 제작</a>
      <a th:href="@{/community}">커뮤니티</a>
    </nav>

    <div class="customer-footer__store">
      <strong>매장 안내</strong>
      <th:block th:if="${store != null}">
        <p th:text="${store.address}">매장 주소</p>
        <p th:text="${store.phone}">매장 연락처</p>
        <p>
          <span th:text="${store.businessHours}">매장 영업시간</span>
          <span class="customer-footer__divider" aria-hidden="true">·</span>
          픽업 <span th:text="${store.pickupPlace}">매장 픽업 장소</span>
        </p>
      </th:block>
      <p th:unless="${store != null}">매장 정보를 준비 중입니다.</p>
    </div>
  </div>
  <div class="customer-footer__bottom">
    <p>&copy; <span data-current-year>2026</span>
      <span th:text="${store != null ? store.name : '케이크 쇼핑몰'}">케이크 쇼핑몰</span>. All rights reserved.</p>
    <p>HANDMADE CAKE · PICKUP SERVICE</p>
  </div>
</footer>
