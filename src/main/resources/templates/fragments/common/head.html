<head th:fragment="head(title)" xmlns:th="http://www.thymeleaf.org">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf?.token}"/>
  <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
  <meta name="member-id" th:if="${#authentication?.principal != null and #authentication.principal.toString().contains('MemberDetails')}" th:content="${#authentication.principal.memberId}"/>
  <title th:text="${title}">스윗한 케이크</title>
  <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
