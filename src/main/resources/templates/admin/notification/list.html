<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf?.token}"/>
  <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
  <title>알림 관리 | 관리자</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/korea-time.js}"></script>
</head>
<body>
  <div class="admin-layout">
    <aside th:replace="~{fragments/admin/sidebar :: sidebar('notifications')}"></aside>
    <div class="admin-main">
      <header th:replace="~{fragments/admin/header :: header('알림 관리')}"></header>
      <main class="admin-content">
        <div class="cluster cluster--between" style="margin-bottom: 1.5rem;">
          <h1 class="admin-page-title" style="margin: 0;">알림 관리</h1>
          <button class="btn btn--sm" type="button" data-read-all>전체 읽음</button>
        </div>

        <section class="section">
          <h2 class="section-title">실시간 관리자 알림 목록</h2>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>발송 시각</th>
                  <th>알림 유형</th>
                  <th>내용</th>
                  <th>상태</th>
                  <th>상세 보기</th>
                </tr>
              </thead>
              <tbody id="admin-notification-container">
                <tr>
                  <td colspan="5" class="text-center text-muted" style="padding: 2rem 0;">알림 데이터를 불러오는 중입니다...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <section>
          <h2 class="section-title">자동 알림 유형 안내</h2>
          <div class="panel">
            <p>· 신규 주문 / 주문 제작: 새로운 주문 접수 시 자동 발생</p>
            <p>· 취소 요청: 고객이 주문 취소를 요청했을 때 발생</p>
            <p>· 신규 리뷰 / 댓글: 고객이 리뷰나 댓글을 작성했을 때 발생</p>
            <p>· 채팅 문의: 고객이 1:1 상담 메시지를 보냈을 때 발생</p>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- ================================================================= -->
  <!-- 🚀 비동기 REST API 처리 자바스크립트 코드 -->
  <!-- ================================================================= -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const container = document.getElementById("admin-notification-container");
      const readAllBtn = document.querySelector("[data-read-all]");

      // 1. 알림 목록 조회 함수
      function loadNotifications() {
        fetch("/api/notifications")
          .then(response => {
            if (!response.ok) throw new Error("알림 데이터를 가져오는 데 실패했습니다.");
            return response.json();
          })
          .then(data => {
            if (!data || data.length === 0) {
              container.innerHTML = `<tr><td colspan="5" class="text-center text-muted" style="padding: 2rem 0;">등록된 관리자 알림이 없습니다.</td></tr>`;
              return;
            }

            function escapeHtml(str) {
              if (!str) return "";
              return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
            }

            let html = "";
            data.forEach(item => {
              const isRead = item.isRead !== undefined ? item.isRead : item.read;
              const statusBadge = isRead
                ? `<span class="badge">읽음</span>`
                : `<span class="badge badge--info">미읽음</span>`;
              
              const displayDate = item.lastEventAt || item.createdAt;
              const formattedDate = window.CakeShopTime.dateTime(displayDate);

              // 상세 링크 버튼 (data-noti-id 추가로 읽음 처리 연동)
              const detailBtn = item.targetUrl
                ? `<a class="btn btn--sm" data-noti-id="${item.id}" href="${escapeHtml(item.targetUrl)}">상세</a>`
                : "";

              const unreadStyle = !isRead ? ` style="font-weight: 600; background-color: rgba(255, 243, 205, 0.2);"` : "";

              html += `
                <tr class="admin-noti-row${!isRead ? ' is-unread' : ''}" data-id="${item.id}"${unreadStyle}>
                  <td>${formattedDate}</td>
                  <td><span class="badge">${escapeHtml(item.title || '알림')}</span></td>
                  <td>${escapeHtml(item.content || '')}</td>
                  <td>${statusBadge}</td>
                  <td>${detailBtn}</td>
                </tr>
              `;
            });

            const existingUnreadRealtimeMap = new Map();
            container.querySelectorAll(".admin-noti-row.is-unread[data-realtime='true'][data-id]").forEach(node => {
              existingUnreadRealtimeMap.set(node.getAttribute("data-id"), node);
            });

            container.innerHTML = html;

            existingUnreadRealtimeMap.forEach((realtimeNode, id) => {
              const restNode = container.querySelector(`.admin-noti-row[data-id="${id}"]`);
              if (restNode) {
                container.replaceChild(realtimeNode, restNode);
              } else if (container.firstChild) {
                container.insertBefore(realtimeNode, container.firstChild);
              } else {
                container.appendChild(realtimeNode);
              }
            });
            attachRowEvents();
          })
          .catch(error => {
            console.error("알림 로드 오류:", error);
            container.innerHTML = `<tr><td colspan="5" class="text-center text-muted" style="padding: 2rem 0;">알림을 불러오는 중 오류가 발생했습니다.</td></tr>`;
          });
      }

      // 2. 전체 읽음 처리
      if (readAllBtn) {
        readAllBtn.addEventListener("click", function () {
          const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
          const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');
          const headers = {};
          if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;

          fetch("/api/notifications/read-all", {
            method: "PATCH",
            headers: headers
          })
          .then(response => {
            if (response.ok) {
              loadNotifications();
              if (typeof updateNotificationUnreadCount === "function") updateNotificationUnreadCount();
            }
          })
          .catch(err => console.error("전체 읽음 실패:", err));
        });
      }

      // 3. 개별 행 및 [상세] 버튼 클릭 시 읽음 처리 이벤트
      function attachRowEvents() {
        // [상세] 버튼 클릭 시 미읽음 알림에만 읽음 API 전송 후 targetUrl 이동 (이미 읽은 알림은 덮어쓰지 않음)
        document.querySelectorAll("a[data-noti-id]").forEach(link => {
          link.addEventListener("click", function (e) {
            const isUnread = this.closest(".is-unread") !== null;
            if (!isUnread) return; // 💡 이미 읽은 알림은 read_at을 덮어쓰지 않고 바로 이동!

            e.preventDefault();
            const targetHref = this.href;
            const notiId = this.getAttribute("data-noti-id");

            const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');
            const headers = {};
            if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;

            fetch(`/api/notifications/${notiId}/read`, {
              method: "PATCH",
              headers: headers
            }).finally(() => {
              location.href = targetHref;
            });
          });
        });

        // 행 자체 클릭 시 읽음 처리 (상세 버튼 제외)
        document.querySelectorAll(".admin-noti-row.is-unread").forEach(row => {
          row.addEventListener("click", function (e) {
            if (e.target.closest("a, button")) return;
            const notiId = this.getAttribute("data-id");
            if (!notiId) return;

            const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');
            const headers = {};
            if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;

            fetch(`/api/notifications/${notiId}/read`, {
              method: "PATCH",
              headers: headers
            })
            .then(res => {
              if (res.ok) {
                loadNotifications();
                if (typeof updateNotificationUnreadCount === "function") updateNotificationUnreadCount();
              }
            });
          });
        });
      }

      window.loadNotifications = loadNotifications;
      loadNotifications();
    });
  </script>
</body>
</html>
