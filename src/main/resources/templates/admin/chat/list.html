<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script th:src="@{/js/lib/sockjs.min.js}"></script>
  <script th:src="@{/js/lib/stomp.min.js}"></script>
  <script defer th:src="@{/js/chat-admin.js}"></script>
</head>

<body data-page-title="채팅 관리">
  <div class="admin-layout">
    <aside th:replace="~{fragments/admin/sidebar :: sidebar('chat')}"></aside>

    <div class="admin-main">
      <header th:replace="~{fragments/admin/header :: header('채팅 관리')}"></header>

      <main class="admin-content">
        <div class="cluster cluster--between section">
          <div>
            <h1>채팅 관리</h1>
            <p class="text-muted">고객 1:1 문의 응대 및 주문 제작 승인·거절 관리 페이지입니다.</p>
          </div>
        </div>

        <!-- 3열 관리자 채팅 레이아웃 -->
        <div class="admin-chat-layout">

          <!-- 1열: 고객 대화방 목록 -->
          <aside class="panel admin-chat-rooms-panel">
            <div class="admin-chat-search">
              <input type="text" class="form-control" id="adminChatSearch" placeholder="고객명 또는 주문번호 검색...">
            </div>

            <div class="admin-chat-filter-tabs" style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 12px 0;">
              <button type="button" class="btn btn--xs is-active" data-admin-filter="all" style="justify-content: center;">전체</button>
              <button type="button" class="btn btn--xs" data-admin-filter="unread" style="justify-content: center;">미답변 <span
                  class="badge badge--danger" id="adminUnreadCountBadge" style="display:none; margin-left: 4px;">0</span></button>
              <button type="button" class="btn btn--xs" data-admin-filter="replied" style="justify-content: center;">답변 완료</button>
              <button type="button" class="btn btn--xs" data-admin-filter="done" style="justify-content: center;">상담 완료</button>
            </div>

            <div class="stack admin-chat-room-list" id="adminChatRoomList">
              <div class="text-muted" style="font-size:12px; padding:10px;">채팅방 목록을 불러오는 중입니다...</div>
            </div>
          </aside>

          <!-- 2열: 중앙 실시간 1:1 대화창 (고객 화면과 동일한 chat-room 구성) -->
          <div class="panel chat-room admin-chat-main-room">
            <!-- 대화방 상단 헤더 -->
            <div class="chat-room__header cluster cluster--between">
              <div>
                <strong>1:1 채팅 상담</strong>
                <p class="text-muted">고객과의 실시간 상담 내역입니다.</p>
              </div>
              <div class="cluster" style="gap:8px;">
                <button type="button" class="btn btn--primary btn--sm" id="completeChatBtn">✓ 상담 완료</button>
                <a class="btn btn--outline btn--sm" th:href="@{/admin/members}">회원 상세 정보</a>
              </div>
            </div>

            <!-- 채팅 타임라인 (chat-messages: 관리자 입장에서 고객=좌측, 관리자=우측) -->
            <div class="chat-messages" id="adminChatMessages">
              <div class="text-muted" style="text-align:center; padding:40px;">대화방을 선택하거나 활성화된 문의 내역이 없습니다.</div>
            </div>

            <!-- 채팅 입력 영역 (고객 화면 chat-input-area 구성과 동일) -->
            <div class="chat-input-area">
              <form class="chat-input-form" id="adminChatForm">
                <div class="chat-input-toolbar cluster">
                  <label class="btn btn--outline" style="cursor:pointer;">
                    📷 이미지 첨부
                    <input type="file" accept="image/*" style="display:none;" id="adminChatImageInput">
                  </label>
                  <span class="text-muted" id="adminImageFileName">선택된 파일 없음</span>
                </div>
                <div class="chat-input-row">
                  <textarea class="form-control" id="adminChatInput" placeholder="고객에게 전송할 메시지를 입력하세요..."
                    rows="2"></textarea>
                  <button type="submit" class="btn btn--primary" style="height:56px; padding:0 20px;">전송</button>
                </div>
              </form>
            </div>
          </div>

          <!-- 3열: 우측 고객 프로필 & 연동 주문 관리 패널 -->
          <aside class="panel admin-chat-info-panel">
            <h3
              style="font-size:14px; margin-bottom:4px; border-bottom:1px solid var(--color-border-light); padding-bottom:6px;">
              연동 주문 내역 (chat_room_orders)</h3>
            <p class="text-muted" style="font-size:11px; margin-bottom:10px;">주문 카드를 클릭하면 해당 문의 대화 위치로 이동합니다.</p>

            <!-- 관리자 메모 영역 -->
            <div class="admin-customer-note" style="border-top:1px solid var(--color-border-light); padding-top:10px;">
              <label for="adminCustomerNote"
                style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">📌 관리자 특이사항 메모</label>
              <textarea class="form-control" id="adminCustomerNote" rows="3" placeholder="고객 특이사항이나 유의사항을 메모하세요..."
                style="font-size:12px;"></textarea>
              <button type="button" class="btn btn--outline btn--xs btn--block" id="saveAdminNoteBtn"
                style="margin-top:6px;">메모 저장</button>
            </div>
          </aside>

        </div>
      </main>
    </div>
  </div>
</body>

</html>
