spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  application:
    name: cakeshop
  thymeleaf:
    # 서버에서는 템플릿을 캐싱한다. 로컬 개발용 핫리로드는 local 프로필에서 끈다.
    cache: true
  servlet:
    multipart:
      # 도메인별 5 MiB 검증까지 요청이 도달하도록 전송 계층 상한은 조금 더 크게 둔다.
      max-file-size: 6MB
      # 상품 이미지 5장과 multipart 부가 데이터를 한 요청으로 받을 수 있게 여유를 둔다.
      max-request-size: 30MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    # 파일명의 타임스탬프는 '만든 시각'이라 머지 순서와 다를 수 있다.
    # 늦게 머지된 낮은 버전도 받아들이지 않으면 validate가 실패한다.
    out-of-order: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  tomcat:
    # 파일 input이 있는 폼은 전체가 multipart라 텍스트·체크박스·CSRF까지 모두 part로 계산된다.
    # Tomcat 11 기본 상한(10)은 매장/상품 폼처럼 필드가 많은 화면에서 쉽게 초과되므로 넉넉히 올린다.
    max-part-count: 100

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.cakeshop.domain
  configuration:
    map-underscore-to-camel-case: true

# 기본값은 health 하나만 연다. 지표 노출은 local 프로필에서만 켠다 —
# /actuator/prometheus 응답에는 모든 엔드포인트의 URI 패턴과 커넥션 풀·JVM 내부 상태가
# 들어 있어 배포 환경에서 익명에게 공개하면 AGENTS.md 의 '내부 경로 비노출'에 걸린다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

app:
  mockup:
    public-preview: false
  monitoring:
    # true 면 /actuator/prometheus 를 인증 없이 연다. 수집기는 로그인하지 않는다.
    metrics-public: false
  kakao:
    alimtalk:
      enabled: ${SOLAPI_ENABLED:false}
      # 솔라피 API Key & API Secret (환경변수로 주입)
      api-key: ${SOLAPI_API_KEY:}
      api-secret: ${SOLAPI_API_SECRET:}
      # 발신자 등록 휴대폰 번호
      sender-phone: ${SOLAPI_SENDER_PHONE:01000000000}
      # 카카오톡 채널 발신프로필 ID (선택 사항)
      pf-id: ${KAKAO_ALIMTALK_PF_ID:}
  member:
    mail:
      from-address: ${MAIL_FROM_ADDRESS:${MAIL_USERNAME:}}
      from-name: ${MAIL_FROM_NAME:SweetHan}
  order:
    expiration:
      fixed-delay-ms: ${ORDER_EXPIRATION_FIXED_DELAY_MS:60000}
      initial-delay-ms: ${ORDER_EXPIRATION_INITIAL_DELAY_MS:60000}
      batch-size: ${ORDER_EXPIRATION_BATCH_SIZE:100}
  file:
    # 업로드 파일을 저장할 로컬 외부 디렉토리 (프로젝트 밖). .env의 FILE_UPLOAD_DIR로 지정.
    upload-dir: ${FILE_UPLOAD_DIR:${user.home}/cakeshop-uploads}
    # 저장 파일에 접근하는 웹 경로 접두. WebConfig 리소스 핸들러와 짝을 이룬다.
    url-prefix: /uploads
  payment:
    # 새 결제에만 적용한다. 기존 결제는 payments.provider로 라우팅한다.
    # 미지정은 toss다. own은 DonWorry 결제창을 쓰며 donworry.payment.enabled=true가 아니면 앱 시작을 중단한다.
    gateway: ${PAYMENT_GATEWAY:toss}
    toss:
      base-url: https://api.tosspayments.com
      # API 키는 로컬 .env 또는 배포 환경변수로만 주입하며 저장소에 커밋하지 않는다.
      client-key: ${TOSS_CLIENT_KEY:}
      secret-key: ${TOSS_SECRET_KEY:}
      connect-timeout: ${TOSS_CONNECT_TIMEOUT:3s}
      read-timeout: ${TOSS_READ_TIMEOUT:5s}
    own:
      # 예비 설정. 자체 PG(DonWorry) 호출은 아래 donworry.payment 설정과 HMAC 키를 쓰며 이 값은 사용하지 않는다.
      base-url: ${OWN_PG_BASE_URL:}
      api-key: ${OWN_PG_API_KEY:}
      connect-timeout: ${OWN_PG_CONNECT_TIMEOUT:3s}
      read-timeout: ${OWN_PG_READ_TIMEOUT:5s}
    recovery:
      fixed-delay: ${PAYMENT_RECOVERY_FIXED_DELAY:60s}
      initial-delay: ${PAYMENT_RECOVERY_INITIAL_DELAY:60s}
      batch-size: ${PAYMENT_RECOVERY_BATCH_SIZE:50}

# DonWorry 결제 API 송신은 실제 키·주소가 준비될 때만 명시적으로 켠다.
# 켜면 OWN 게이트웨이가 등록되고 결제 화면의 결제창 선택에 돈워리가 열린다.
donworry:
  payment:
    enabled: ${DONWORRY_PAYMENT_ENABLED:false}
    base-url: ${DONWORRY_PAYMENT_BASE_URL:}
    merchant-code: ${DONWORRY_MERCHANT_CODE:CAKESHOP}
    key-environment-variable: DONWORRY_MERCHANT_HMAC_CAKESHOP
    connect-timeout: ${DONWORRY_PAYMENT_CONNECT_TIMEOUT:3s}
    read-timeout: ${DONWORRY_PAYMENT_READ_TIMEOUT:5s}

---
# Google/Kakao OAuth login. Team members configure both providers in .env.
spring:
  config:
    activate:
      on-profile: oauth
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  member:
    oauth:
      google-enabled: true
      kakao-enabled: true

---
# S3 파일 저장소: DB 프로필(local/rds)과 조합해서 사용한다.
spring:
  config:
    activate:
      on-profile: s3
aws:
  region: ${AWS_REGION:ap-northeast-2}
  # 로컬 .env에서만 사용한다. 배포 환경에서 비어 있으면 AWS SDK 기본 인증 체인(IAM Role 등)을 사용한다.
  access-key: ${AWS_ACCESS_KEY_ID:}
  secret-key: ${AWS_SECRET_ACCESS_KEY:}
  session-token: ${AWS_SESSION_TOKEN:}
  s3:
    bucket: ${AWS_S3_BUCKET}
    # S3 또는 CloudFront의 공개 기본 URL이며 끝의 슬래시는 제외한다.
    base-url: ${AWS_S3_BASE_URL}
    # 로컬 개발자와 RDS가 서로의 객체를 삭제하지 않도록 환경마다 고유한 prefix를 사용한다.
    key-prefix: ${AWS_S3_KEY_PREFIX}

---
# 기본 개발 환경: 각 PC에 직접 설치한 MariaDB
spring:
  config:
    activate:
      on-profile: local
  # 로컬 개발에서는 템플릿 수정 즉시 반영되도록 캐시를 끈다.
  thymeleaf:
    cache: false
  datasource:
    # connectionTimeZone: 애플리케이션과 DB가 같은 날짜 경계를 쓰게 만든다.
    # 인기글 배치가 서울 기준 날짜를 넘기는데 created_at 은 DB 시계로 박히므로,
    # 세션 시간대를 맞추지 않으면 DB 가 UTC 인 환경에서 창이 9시간 어긋난다.
    # (docs/community/PLAN.md D10)
    #
    # 'Asia/Seoul' 이 아니라 '+09:00' 인 이유: 이 옵션은 세션에 SET time_zone 을 거는데,
    # 이름으로 된 시간대는 MariaDB 의 mysql.time_zone_name 테이블이 채워져 있어야 한다.
    # 기본 설치에는 비어 있어서 이름을 쓰면 연결 자체가 'Unknown or incorrect time zone'
    # 으로 실패한다 — 팀원마다 로컬 DB 에 tzinfo 를 적재해야 하는 설치 단계가 생긴다.
    # 한국 표준시는 1988년 이후 서머타임이 없어 +09:00 이 항상 KST 와 같으므로,
    # 고정 오프셋으로 적어 그 전제를 없앤다.
    url: "jdbc:mariadb://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT}/${LOCAL_DB_DATABASE}?connectionTimeZone=+09:00&forceConnectionTimeZoneToSession=true"
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

app:
  mockup:
    # 화면 선이관 기간에만 조회 화면을 로그인 없이 확인한다. rds에서는 false다.
    public-preview: true
  monitoring:
    # 로컬 측정용. 수집기는 로그인하지 않으므로 인증 없이 연다.
    metrics-public: true

---
# 공용 AWS RDS: 프로젝트 루트의 .env에서 접속 정보를 읽는다.
spring:
  config:
    activate:
      on-profile: rds
  datasource:
    # 공용 개발 RDS의 require_secure_transport=ON 대응: TLS로 암호화해 연결한다.
    # connectionTimeZone 은 local 과 같은 이유이고 값도 같아야 한다(PLAN.md D10).
    # RDS 는 기본이 UTC 라 이 설정이 빠지면 서울 기준 날짜 경계가 9시간 어긋난다.
    # 두 프로필이 다른 값을 쓰면 로컬에서 맞던 날짜가 배포에서만 틀어지므로 함께 고친다.
    #
    # ▸ 이미 데이터가 쌓인 DB 에 이 설정을 처음 붙일 때는 보정이 먼저다 (PLAN.md R31)
    #
    # 우리 시각 컬럼은 전부 DATETIME 이고 TIMESTAMP 가 하나도 없다. DATETIME 은 시간대가
    # 안 붙은 벽시계 숫자라 세션 시간대를 바꿔도 **기존 행의 값이 따라오지 않는다**
    # (TIMESTAMP 였다면 읽을 때 자동 변환되어 저절로 맞았다).
    #
    # 그래서 UTC 세션으로 쌓인 DB 에 이 줄을 그냥 붙이면, 그 순간부터 NOW(6) 는 KST 인데
    # 기존 created_at 은 UTC 벽시계 그대로라 둘의 기준이 갈린다. 조회수 10분 창이 기존
    # 이력을 못 보고(중복 차단이 잠시 뚫린다), 인기글 집계 창의 경계가 9시간 밀린다.
    #
    # 지금은 해당하는 DB 가 없다 — rds 는 아래대로 Flyway 가 꺼져 있어 테이블 자체가
    # 만들어지지 않았고, 로컬은 MariaDB 기본값이 time_zone=SYSTEM 이라 원래 KST 였다.
    # 스키마 반영 절차가 생기는 시점에 이 문단을 다시 읽는다.
    url: "jdbc:mariadb://${RDS_ENDPOINT}:${RDS_PORT:3306}/${RDS_DATABASE}?sslMode=trust&connectionTimeZone=+09:00&forceConnectionTimeZoneToSession=true"
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  flyway:
    # 애플리케이션 기동으로 공용 RDS 스키마가 변경되지 않도록 차단한다.
    # RDS 스키마 변경은 검토·승인된 별도 반영 절차로만 수행한다.
    enabled: false
